<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f79"><title>Human Literacy Lab | The Story We Tell Ourselves</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#edf5f3;color:#17292e}*{box-sizing:border-box}body{margin:0}main{max-width:730px;margin:auto;padding:20px 15px 64px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:25px}.brand{font-weight:850;letter-spacing:.035em;color:#087f79}.meta{font-size:.78rem;color:#53646a;text-align:right}.panel{background:white;border:1px solid #d3e5df;border-radius:23px;padding:clamp(20px,5vw,34px);box-shadow:0 12px 32px #123a2b0a}h1{font-size:clamp(1.8rem,6vw,2.5rem);line-height:1.13;margin:8px 0 18px}h2{font-size:1.4rem;line-height:1.25}p,li{font-size:1.04rem;line-height:1.62}.eyebrow{color:#087f79;font-weight:850;letter-spacing:.09em;font-size:.8rem;text-transform:uppercase}.muted{color:#53646a}.scene{background:#f0f7f5;border-left:5px solid #087f79;border-radius:12px;padding:16px 18px;margin:20px 0}.scene p{margin:0}.choices{display:grid;gap:11px;margin-top:20px}button{font:inherit;cursor:pointer;border-radius:12px;padding:15px 17px;min-height:50px;text-align:left;border:2px solid #c5d9d4;background:white;color:#17292e;font-weight:650}button:hover{border-color:#087f79}button:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}button.primary{background:#087f79;border-color:#087f79;color:white;text-align:center}button.secondary{color:#087f79;border-color:#087f79;text-align:center}.feedback{background:#f0f7f5;border-radius:14px;padding:17px;margin:18px 0}.feedback strong{color:#066e68}.progress{height:9px;background:#d8e7e3;border-radius:10px;overflow:hidden;margin:14px 0 22px}.progress div{height:100%;background:#087f79;transition:width .2s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#edf5f3;padding:12px 6px;border-radius:13px;text-align:center}.stat b{display:block;font-size:1.5rem}.stat span{font-size:.77rem;color:#53646a}.note{font-size:.85rem;color:#53646a}.hidden{display:none}footer{font-size:.8rem;color:#53646a;text-align:center;margin-top:18px}@media(max-width:380px){.stats{grid-template-columns:1fr}.top{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header class="top"><div class="brand">HUMAN LITERACY LAB</div><div class="meta">Lesson 02 · Free · No sign-in</div></header><section id="app" class="panel" aria-live="polite"></section><footer>Practice understanding, not perfection. Your choices stay on this device during this session.</footer></main>
<script>
'use strict';
const scenarios=[
{title:'The unanswered message',scene:'You send a friend a thoughtful message. A day passes with no reply. You notice yourself thinking: “They must be ignoring me.”',question:'What is the most useful first step?',choices:[['Send another message accusing them of ignoring you.','That treats an interpretation as a fact. It may create a conflict before you know what happened.',0],['Notice the feeling and consider other possible explanations.','Good distinction. The silence is observable; the reason is unknown. They may be busy, overwhelmed, or choosing not to respond.',1],['Decide the friendship is over without asking.','You can set boundaries around communication, but one unanswered message does not establish someone’s intention.',0]],takeaway:'Fact: no reply yet. Story: “They are ignoring me.” You can care about your needs without claiming to know their reasons.'},
{title:'The look across the room',scene:'During a family gathering, someone looks at you briefly and turns away. You feel uncomfortable and think: “They dislike me.”',question:'What response leaves room for reality?',choices:[['Treat the glance as proof of their feelings.','A glance does not reliably reveal someone’s private thoughts.',0],['Ask everyone else what that person thinks of you.','This can spread speculation and make the situation more complicated.',0],['Acknowledge that you felt uncomfortable, without assuming what the glance meant.','Exactly. Your feeling is real; your explanation is still uncertain. You may choose to talk with them if it matters.',1]],takeaway:'Feelings deserve attention, but they do not automatically prove our interpretation.'},
{title:'The missed promise',scene:'A coworker agreed to send information by noon. It is now 3 PM, and nothing has arrived. You need the information to finish your task.',question:'How can you respond clearly without mind-reading?',choices:[['“You clearly do not respect my time.”','The missed deadline is real, but the motive has not been established.',0],['Say nothing and keep building resentment.','Silence may leave your practical need unmet.',0],['“I was expecting the information by noon. Can you update me on when it will arrive?”','This names the observable problem, asks for information, and protects your ability to plan.',1]],takeaway:'You do not need to excuse a missed commitment to avoid inventing a motive. State the facts and your needs.'}
];
const quiz=[
{q:'Someone has not replied to your message. Which statement is a fact?',a:['They are angry with me.','They have not replied yet.','They no longer value me.'],correct:1,why:'A missing reply is observable. The other statements guess at motives.'},
{q:'Can a feeling be real even when the explanation for it is mistaken?',a:['Yes. Feelings and interpretations are different.','No. Strong feelings always reveal the truth.','Only when someone agrees with you.'],correct:0,why:'Emotions give useful information about your experience, not automatic proof about another person.'},
{q:'What is a helpful way to address a missed commitment?',a:['Accuse the person of disrespect.','Assume the worst and withdraw.','Describe what happened and ask for an update.'],correct:2,why:'Naming the observable event and asking directly creates clarity without mind-reading.'}
];
let stage='intro',i=0,selected=null,practice=0,answers=[];
const app=document.getElementById('app');
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
if(stage==='intro'){app.innerHTML=`<div class="eyebrow">Everyday thinking skills</div><h1>The Story We Tell Ourselves</h1><p>Something happens. Our mind gives it a meaning. Sometimes that meaning is wrong.</p><div class="scene"><p><strong>Try this:</strong> Learn to separate <strong>what you know</strong> from <strong>what you assume</strong>—without dismissing your feelings or your needs.</p></div><p>Make decisions in three familiar situations. You'll get an explanation after each choice, then answer three short questions.</p><p class="note">About 5 minutes · No account · No personal information collected</p><button class="primary" id="start">Start the lesson</button>`;document.getElementById('start').onclick=()=>{stage='scenario';render()};return;}
if(stage==='scenario'){const s=scenarios[i];app.innerHTML=`<div class="eyebrow">Scenario ${i+1} of 3</div><div class="progress" aria-label="Lesson progress"><div style="width:${(i/3)*70}%"></div></div><h1>${escapeHTML(s.title)}</h1><div class="scene"><p>${escapeHTML(s.scene)}</p></div><h2>${escapeHTML(s.question)}</h2><div class="choices">${s.choices.map((c,j)=>`<button data-choice="${j}">${escapeHTML(c[0])}</button>`).join('')}</div><div id="response"></div>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice));return;}
if(stage==='quiz'){const q=quiz[i];app.innerHTML=`<div class="eyebrow">Knowledge check · ${i+1} of 3</div><div class="progress"><div style="width:${70+(i/3)*30}%"></div></div><h1>${escapeHTML(q.q)}</h1><div class="choices">${q.a.map((a,j)=>`<button data-answer="${j}">${escapeHTML(a)}</button>`).join('')}</div><div id="response"></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));return;}
const correct=answers.filter(Boolean).length;app.innerHTML=`<div class="eyebrow">Lesson complete</div><h1>Your learning summary</h1><div class="stats"><div class="stat"><b>3/3</b><span>Scenarios explored</span></div><div class="stat"><b>${practice}/3</b><span>Reflective choices</span></div><div class="stat"><b>${correct}/3</b><span>Knowledge check</span></div></div><h2>${correct===3?'You recognized the key ideas.':'You practiced an important skill.'}</h2><p><strong>Notice:</strong> What happened?</p><p><strong>Separate:</strong> What story did I add?</p><p><strong>Respond:</strong> What can I ask, clarify, or do next?</p><div class="scene"><p><strong>One small practice:</strong> The next time you catch yourself saying “They must think…,” try adding “I don't know that yet.”</p></div><p class="note">This activity checks immediate understanding, not long-term behavior or psychological health. There is no score for being a good person.</p><div class="choices"><button class="primary" id="replay">Replay entire lesson</button><button class="secondary" id="retry">Retake only the knowledge check</button></div>`;document.getElementById('replay').onclick=()=>{stage='intro';i=0;practice=0;answers=[];render()};document.getElementById('retry').onclick=()=>{stage='quiz';i=0;answers=[];render()};
}
function choose(j){if(selected!==null)return;selected=j;const s=scenarios[i],c=s.choices[j];practice+=c[2];app.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);const r=document.getElementById('response');r.innerHTML=`<div class="feedback"><strong>${c[2]?'Helpful choice':'Consider this'}</strong><p>${escapeHTML(c[1])}</p><p><strong>Remember:</strong> ${escapeHTML(s.takeaway)}</p></div><button class="primary" id="next">${i===2?'Continue to knowledge check':'Next scenario'}</button>`;document.getElementById('next').onclick=()=>{selected=null;i++;if(i===3){i=0;stage='quiz'}render()};r.scrollIntoView({behavior:'smooth',block:'nearest'});}
function answer(j){if(selected!==null)return;selected=j;const q=quiz[i],ok=j===q.correct;answers.push(ok);app.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);const r=document.getElementById('response');r.innerHTML=`<div class="feedback"><strong>${ok?'Correct':'Learning opportunity'}</strong><p>${escapeHTML(q.why)}</p></div><button class="primary" id="next">${i===2?'See learning summary':'Next question'}</button>`;document.getElementById('next').onclick=()=>{selected=null;i++;if(i===3)stage='done';render()};r.scrollIntoView({behavior:'smooth',block:'nearest'});}
render();
</script></body></html>
