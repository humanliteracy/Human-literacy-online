</head><body><main><div class="brand">HUMAN LITERACY · INTERACTIVE LESSON</div><header class="lesson-heading" aria-label="Lesson number and title"><span>LESSON 03</span><strong>Recognizing and Managing Emotional Reactions</strong></header><div id="app" aria-live="polite"></div><footer>Educational practice, not a diagnosis or individualized professional advice. Your choices stay on this device; no account required.</footer></main><script> 'use strict';
const DATA={"scenarios":[{"title":"The sharp reply","scene":"Someone at home answers your simple question in a sharp tone. You feel hurt and angry, but you do not know what caused their tone.","question":"What would you say to the person?","choices":[{"text":"“That sounded sharp. I am feeling hurt, and I want to understand what is going on.”","rating":"Strongest response","why":"You name the impact without claiming to know their intention, opening the door to clarification.","points":2,"feedback":"You name the impact without claiming to know their intention, opening the door to clarification.","best":true},{"text":"“You seem stressed. I will give you some space and we can talk later.”","rating":"Reasonable alternative","why":"Space may help, but saying they seem stressed is still an interpretation. Check whether postponing is actually helpful.","points":1,"feedback":"Space may help, but saying they seem stressed is still an interpretation. Check whether postponing is actually helpful. Another approach: “That sounded sharp. I am feeling hurt, and I want to understand what is going on.” You name the impact without claiming to know their intention, opening the door to clarification.","best":false},{"text":"“I did not like that tone. Please speak to me more gently.”","rating":"Reasonable alternative","why":"You can ask for respectful communication, but a brief check-in may help explain an isolated tense moment.","points":1,"feedback":"You can ask for respectful communication, but a brief check-in may help explain an isolated tense moment. Another approach: “That sounded sharp. I am feeling hurt, and I want to understand what is going on.” You name the impact without claiming to know their intention, opening the door to clarification.","best":false}]},{"title":"The changed plan","scene":"A friend cancels dinner at the last minute. You were looking forward to it and feel disappointed. They offer no explanation.","question":"What would you say to your friend?","choices":[{"text":"“I understand plans change. Let us choose another date when you are free.”","rating":"Partly effective","why":"You are flexible, but you leave your disappointment and the last-minute impact unspoken.","points":1,"feedback":"You are flexible, but you leave your disappointment and the last-minute impact unspoken. Another approach: “I was disappointed because I had planned around tonight. Is everything okay?” You express your experience clearly while allowing room for information you do not have.","best":false},{"text":"“I was disappointed because I had planned around tonight. Is everything okay?”","rating":"Strongest response","why":"You express your experience clearly while allowing room for information you do not have.","points":2,"feedback":"You express your experience clearly while allowing room for information you do not have.","best":true},{"text":"“I would appreciate more notice next time. I will reach out when I am ready to reschedule.”","rating":"Reasonable alternative","why":"This is a valid boundary, especially if cancellations repeat, though it may be worth checking what happened first.","points":1,"feedback":"This is a valid boundary, especially if cancellations repeat, though it may be worth checking what happened first. Another approach: “I was disappointed because I had planned around tonight. Is everything okay?” You express your experience clearly while allowing room for information you do not have.","best":false}]},{"title":"The crowded afternoon","scene":"Three people ask for help at once. You feel overwhelmed and impatient. Two requests are routine; one may be time-sensitive.","question":"What would you do first?","choices":[{"text":"Handle the fastest tasks first without checking which request is urgent.","rating":"Partly effective","why":"Quick wins may feel useful, but urgency and your capacity matter more than speed alone.","points":1,"feedback":"Quick wins may feel useful, but urgency and your capacity matter more than speed alone.","best":false},{"text":"Ask everyone to wait without checking whether any request needs immediate attention.","rating":"Reasonable alternative","why":"A pause can help you regulate, but you still need to identify whether any request is urgent.","points":1,"feedback":"A pause can help you regulate, but you still need to identify whether any request is urgent.","best":false},{"text":"Pause, check whether any request is urgent, and explain what you can realistically handle.","rating":"Strongest response","why":"You recognize your limits, assess priorities, and make commitments you can sustain.","points":2,"feedback":"You recognize your limits, assess priorities, and make commitments you can sustain.","best":true}]}],"quiz":[{"q":"Someone's tone hurts you. What would you say without assuming their intention?","choices":["“You intended to be rude, but I forgive you.”","“It’s fine. Nothing bothered me.”","“That sounded sharp, and I felt hurt. Can we talk about what happened?”"],"correct":2,"why":"You can describe the impact without claiming to know the other person's intention.","feedbacks":["Forgiveness may help, but claiming you know their intent goes beyond what the tone alone proves.","Ignoring the feeling does not help you understand or communicate its impact.","You name your experience while staying open to information about their intent."]},{"q":"A friend cancels unexpectedly. What would you say to express disappointment and remain curious?","choices":["“I was disappointed. Is everything okay, and can we discuss rescheduling?”","“You never keep your plans. I’m done.”","“It doesn’t matter.”"],"correct":0,"why":"You can express your experience and remain curious about theirs. Strongest answer: “I was disappointed. Is everything okay, and can we discuss rescheduling?”","feedbacks":["You express disappointment, check on your friend, and suggest a practical next step.","One cancellation is not enough evidence to conclude the friend cannot keep plans.","Silence can avoid conflict but may also prevent an honest conversation about expectations."]},{"q":"Several people need your help. What is the strongest first action?","choices":["Agree to requests in the order they arrived.","Pause, identify urgency, and explain what you can realistically do.","Finish the easiest requests first without checking urgency."],"correct":1,"why":"A short pause, prioritization, and clear limits help you respond effectively.","feedbacks":["First-come-first-served ignores urgency and your actual capacity to help.","You assess what matters most, communicate limits, and commit only to what you can do.","Doing easy tasks first may neglect urgent needs and leaves others unsure what to expect."]}]};
const app=document.getElementById('app');
const scenarioItems=typeof DATA!=='undefined'?DATA.scenarios:scenarios;
const quizItems=typeof DATA!=='undefined'?DATA.quiz:quiz;
let stage='intro',index=0,selected=-1,viewed=new Set(),practiceScore=0,quizAnswers=[],submitted=false,firstChoiceRecorded=false;
const lessonTitle=document.title.replace(/^Lesson \d+ — /,'').replace(/ \| Human Literacy$/,'');
function element(tag,cls,txt,parent=app){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;parent.append(e);return e}
function action(label,fn,secondary=false,parent=app){const b=element('button',secondary?'action secondary':'action',label,parent);b.type='button';b.addEventListener('click',fn);return b}
function optionsFor(item){return item.choices.map(c=>typeof c==='string'?{text:c}:c)}
function bestIndex(item){return typeof item.correct==='number'?item.correct:optionsFor(item).findIndex(c=>c.best)}
function resetSelection(){selected=-1;viewed=new Set();firstChoiceRecorded=false;submitted=false}
function advance(){savePage();index++;resetSelection();if(stage==='practice'&&index===scenarioItems.length){stage='quiz';index=0}else if(stage==='quiz'&&index===quizItems.length){stage='results';index=0}render();window.scrollTo(0,0)}
function restart(){pageSnapshots.clear();stage='intro';index=0;practiceScore=0;quizAnswers=[];resetSelection();render();window.scrollTo(0,0)}
const pageOrder=[{stage:'intro',index:0},...scenarioItems.map((_,i)=>({stage:'practice',index:i})),...quizItems.map((_,i)=>({stage:'quiz',index:i})),{stage:'results',index:0},{stage:'live',index:0}];
const pageSnapshots=new Map();
function pageKey(){return stage+':'+index}
function savePage(){pageSnapshots.set(pageKey(),{selected,viewed:[...viewed],firstChoiceRecorded,submitted})}
function navigatePage(delta){savePage();const at=pageOrder.findIndex(p=>p.stage===stage&&p.index===index),target=pageOrder[at+delta];if(!target)return;stage=target.stage;index=target.index;const saved=pageSnapshots.get(pageKey());if(saved){selected=saved.selected;viewed=new Set(saved.viewed);firstChoiceRecorded=saved.firstChoiceRecorded;submitted=saved.submitted}else resetSelection();render();window.scrollTo(0,0)}
function navigation(){const bar=element('nav','lesson-navigation');bar.setAttribute('aria-label','Lesson navigation');const at=pageOrder.findIndex(p=>p.stage===stage&&p.index===index);const back=action('← Back',()=>navigatePage(-1),true,bar);back.disabled=at===0;action('⌂ Home',()=>{location.href='../../'},true,bar);const next=action('Forward →',()=>navigatePage(1),true,bar);next.disabled=at===pageOrder.length-1;const note=element('p','muted','Navigation lets you review or skip pages. Skipped knowledge-check questions are recorded as unanswered.');note.style.fontSize='.85rem'}
function progress(){const total=scenarioItems.length+quizItems.length,done=(stage==='quiz'?scenarioItems.length:0)+index;const p=element('div','progress');p.setAttribute('role','progressbar');p.setAttribute('aria-label','Lesson progress');p.setAttribute('aria-valuemin','0');p.setAttribute('aria-valuemax',String(total));p.setAttribute('aria-valuenow',String(done));const fill=element('div','fill');fill.style.width=(100*done/total)+'%';p.append(fill)}
function render(){app.replaceChildren();navigation();
if(stage==='intro'){
element('div','eyebrow','SEE IT · UNDERSTAND IT');
element('h1','','Notice the feeling before choosing');
element('p','','Someone answers you sharply. Your body tenses and you feel hurt. You may want to snap back, but the feeling does not have to choose your response.');
const a=element('section','feedback');element('strong','','WHAT HAPPENED',a);element('p','','Someone used a sharp tone. You felt hurt.',a);
const b=element('section','feedback');element('strong','','WHAT YOU MIGHT THINK',b);element('p','','You might think: “They are trying to disrespect me.” That thought may be understandable, but their intention is not confirmed.',b);
const c=element('section','feedback');element('strong','','WHAT YOU CAN CHOOSE',c);element('p','','Pause briefly, notice your emotion, and decide whether to ask a question, state a boundary, or take space.',c);
element('h2','','Remember this');element('p','summary','Notice the feeling. Check the story. Choose the next step.');
action('Start interactive practice',()=>{stage='practice';index=0;resetSelection();render();window.scrollTo(0,0)});
return}

if(stage==='live'){
element('div','eyebrow','STEP 5 OF 5 · LIVE IT');
element('h1','','Take the skill into real life');
element('p','','Try this 30-second practice now, without needing another person.');
const a=element('section','feedback');element('strong','','1 · NOTICE',a);element('p','','Recall a recent strong emotion. What did you feel? Name it silently.',a);
const b=element('section','feedback');element('strong','','2 · RECOGNIZE',b);element('p','','What did you notice in your body—tension, warmth, a faster heartbeat, or something else?',b);
const c=element('section','feedback');element('strong','','3 · CHOOSE',c);element('p','','Think of one response you could choose next time: ask a question, state a boundary, or take a short pause.',c);
element('h2','','Remember this');element('p','summary','Notice the feeling. Check the story. Choose the next step.');
element('p','','You can practice privately. You do not need to confront anyone or share your experience.');
element('h2','','Try it again later');element('p','','Tomorrow or next week, notice one emotion as it arises and try this short sequence again.');
action('Practice lesson again',restart);
action('Back to all lessons',()=>{location.href='../../'},true);
return}
if(stage==='results'){const correct=quizAnswers.filter((a,i)=>a===bestIndex(quizItems[i])).length;const answered=quizAnswers.filter(a=>a!==undefined).length;element('div','eyebrow','LESSON COMPLETE');element('h1','',lessonTitle);element('p','summary','Remember It knowledge check: '+correct+' of '+quizItems.length+' correct ('+answered+' answered).');element('p','','Practice is for comparing perspectives, not getting everything right immediately. Your first practice choices: '+practiceScore+' of '+scenarioItems.length+' strongest.');element('h2','','Review your answers');quizItems.forEach((q,i)=>{const opts=optionsFor(q),right=bestIndex(q),answer=quizAnswers[i];const box=element('section','feedback');element('strong','',String(i+1)+'. '+(q.q||q.question),box);element('p','', 'Your answer: '+(opts[answer]?.text||'No answer')+(answer===right?' — Correct':' — Review this'),box);element('p','', 'Recommended: '+opts[right].text,box);element('p','',q.why||opts[right].why||opts[right].feedback||'',box)});action('Continue to Step 5 · Live it',()=>{savePage();stage='live';index=0;resetSelection();render();window.scrollTo(0,0)});return}
const isQuiz=stage==='quiz',item=(isQuiz?quizItems:scenarioItems)[index],opts=optionsFor(item);
element('div','eyebrow',isQuiz?'REMEMBER IT · KNOWLEDGE CHECK '+(index+1)+' OF '+quizItems.length:'PRACTICE SITUATION '+(index+1)+' OF '+scenarioItems.length);progress();
element('h1','',isQuiz?'Remember It — Check your understanding':item.title||'Explore the situation');if(!isQuiz&&item.scene)element('p','',item.scene);element('p','question',item.question||item.q);
if(isQuiz){element('p','explore','Choose one answer, then submit it. Explanations and correct answers appear only after all questions.');}
else{element('p','explore','Explore all '+opts.length+' responses and compare their tradeoffs before continuing.');}
const holder=element('div','options');
opts.forEach((c,i)=>{const b=element('button','option'+(selected===i?' chosen':''),c.text,holder);b.type='button';b.setAttribute('aria-pressed',String(selected===i));if(isQuiz&&submitted)b.disabled=true;b.addEventListener('click',()=>{if(isQuiz){if(submitted)return;selected=i;render();return}if(!firstChoiceRecorded){if(i===bestIndex(item))practiceScore++;firstChoiceRecorded=true}selected=i;viewed.add(i);render()})});
if(isQuiz){const b=action('Submit answer',()=>{if(selected<0)return;quizAnswers[index]=selected;savePage();advance()});b.disabled=selected<0;if(selected<0)element('p','muted','Select an answer to enable submission.');return}
if(selected>=0){const c=opts[selected],box=element('section','feedback');element('h3','',c.rating||c.quality||(c.best?'Strongest response':'Consider the tradeoff'),box);element('p','',c.why||c.feedback||'',box)}
element('p','explore','Compared '+viewed.size+' of '+opts.length+' responses'+(viewed.size<opts.length?'. Select the remaining responses to unlock Next.':'. You are ready to continue.'));
const b=action(index===scenarioItems.length-1?'Continue to Remember It':'Next situation',advance);b.disabled=viewed.size<opts.length;
}
render();
