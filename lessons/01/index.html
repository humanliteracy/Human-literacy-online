const DATA={"scenarios": [{"title": "The misunderstood message", "scene": "A friend says you rarely respond promptly. Yesterday you were helping someone and did not check your phone. You feel unfairly criticized.", "question": "How would you reply?", "choices": [{"text": "“I was helping someone yesterday. I can explain, but first tell me what worried you.”", "rating": "Strongest response", "why": "You acknowledge their concern, give relevant context, and invite clarification without accepting the sweeping accusation.", "points": 2, "feedback": "You acknowledge their concern, give relevant context, and invite clarification without accepting the sweeping accusation.", "best": true}, {"text": "“I was helping someone yesterday, so I think it is fair to expect some patience.”", "rating": "Partly effective", "why": "Your explanation and request for patience are reasonable, but you have not yet learned what your friend experienced.", "points": 1, "feedback": "Your explanation and request for patience are reasonable, but you have not yet learned what your friend experienced. Another approach: “I was helping someone yesterday. I can explain, but first tell me what worried you.” You acknowledge their concern, give relevant context, and invite clarification without accepting the sweeping accusation.", "best": false}, {"text": "“I understand you were upset. I will try to answer every message sooner.”", "rating": "Partly effective", "why": "You show empathy, but promising faster replies may set an expectation you cannot consistently meet.", "points": 1, "feedback": "You show empathy, but promising faster replies may set an expectation you cannot consistently meet. Another approach: “I was helping someone yesterday. I can explain, but first tell me what worried you.” You acknowledge their concern, give relevant context, and invite clarification without accepting the sweeping accusation.", "best": false}]}, {"title": "The extra errand", "scene": "A relative asks you to cancel plans to run a nonurgent errand. You often help, but today you already have an important commitment.", "question": "What is the most respectful response?", "choices": [{"text": "“I can do it tonight after my plans, even though it will make my evening longer.”", "rating": "Partly effective", "why": "This may be generous, but it risks treating your available time as unlimited. You need not overextend yourself to show care.", "points": 1, "feedback": "This may be generous, but it risks treating your available time as unlimited. You need not overextend yourself to show care. Another approach: “I cannot cancel today. I can help tomorrow afternoon if that timing works.” You state a clear, realistic limit and offer help you can actually provide.", "best": false}, {"text": "“I cannot cancel today. I can help tomorrow afternoon if that timing works.”", "rating": "Strongest response", "why": "You state a clear, realistic limit and offer help you can actually provide.", "points": 2, "feedback": "You state a clear, realistic limit and offer help you can actually provide.", "best": true}, {"text": "“I need to keep my plans today. Please ask someone else this time.”", "rating": "Reasonable alternative", "why": "A clear limit is valid. If you are willing and able, suggesting a specific alternative could preserve more cooperation.", "points": 1, "feedback": "A clear limit is valid. If you are willing and able, suggesting a specific alternative could preserve more cooperation. Another approach: “I cannot cancel today. I can help tomorrow afternoon if that timing works.” You state a clear, realistic limit and offer help you can actually provide.", "best": false}]}, {"title": "The urgent warning", "scene": "An alarming social media post claims a familiar household product is dangerous. It includes a screenshot of a supposed study but no link or publication date.", "question": "What should you do before passing it along?", "choices": [{"text": "“I will share it with a warning that the information is unconfirmed.”", "rating": "Partly effective", "why": "A disclaimer does not stop an unsupported claim from spreading or being repeated as fact.", "points": 1, "feedback": "A disclaimer does not stop an unsupported claim from spreading or being repeated as fact. Another approach: “I will trace the study, check its date and findings, and compare reliable independent sources.” You test the claim rather than trusting or dismissing it based on its emotional presentation.", "best": false}, {"text": "“I will wait for a government announcement before believing anything about it.”", "rating": "Partly effective", "why": "Official alerts are useful, but reliable evidence can come from multiple credible sources. Waiting only for one authority can miss context.", "points": 1, "feedback": "Official alerts are useful, but reliable evidence can come from multiple credible sources. Waiting only for one authority can miss context. Another approach: “I will trace the study, check its date and findings, and compare reliable independent sources.” You test the claim rather than trusting or dismissing it based on its emotional presentation.", "best": false}, {"text": "“I will trace the study, check its date and findings, and compare reliable independent sources.”", "rating": "Strongest response", "why": "You test the claim rather than trusting or dismissing it based on its emotional presentation.", "points": 2, "feedback": "You test the claim rather than trusting or dismissing it based on its emotional presentation.", "best": true}]}], "quiz": [{"q": "A friend sounds hurt by a delayed reply. Which response is most constructive?", "choices": ["“I was busy, so there is nothing to discuss.”", "“I want to understand what upset you, then I can explain what happened.”", "“I will reply instantly from now on.”"], "correct": 1, "why": "Understanding their concern first creates room for both perspectives without making an unrealistic promise. Strongest answer: “I want to understand what upset you, then I can explain what happened.”", "feedbacks": ["This shuts down the conversation before learning what hurt your friend. Being busy explains the delay but does not address the impact.", "You invite their perspective before explaining yours. Both people can be heard without assigning blame.", "An immediate-reply promise may be impossible to keep and creates expectations that could cause more conflict."]}, {"q": "A relative asks for help when you have a prior commitment. Which is the strongest boundary?", "choices": ["“I will cancel if it makes you feel better.”", "“I can do everything tomorrow, whatever you need.”", "“I cannot change today’s plans. I can help with this tomorrow afternoon.”"], "correct": 2, "why": "Specific limits and realistic offers are more sustainable than vague or guilt-driven promises. Strongest answer: “I cannot change today’s plans. I can help with this tomorrow afternoon.”", "feedbacks": ["Cancelling only to ease guilt may disregard an existing commitment and create resentment.", "Promising everything tomorrow ignores your time and capacity; it is not a reliable boundary.", "You protect your prior commitment and make a specific offer you can realistically keep."]}, {"q": "An alarming post cites an unnamed study. What is the strongest first move?", "choices": ["“I will look for the original study and independent confirmation before sharing.”", "“I will share it only with people I trust.”", "“I will ignore it because the wording sounds exaggerated.”"], "correct": 0, "why": "Verification is more reliable than selective sharing or dismissing a claim based only on tone. Strongest answer: “I will look for the original study and independent confirmation before sharing.”", "feedbacks": ["You seek the original evidence and independent confirmation before spreading an alarming claim.", "Sharing only with trusted people can still spread false information and harm people you care about.", "A dramatic tone warrants caution, but it does not prove the claim is false. Check the evidence."]}]};

const app=document.getElementById('app');
const scenarioItems=typeof DATA!=='undefined'?DATA.scenarios:scenarios;
const quizItems=typeof DATA!=='undefined'?DATA.quiz:quiz;

const lessonTitle=document.title.replace(/^Lesson \d+ — /,'').replace(/ \| Human Literacy$/,'');
function element(tag,cls,txt,parent=app){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;parent.append(e);return e}
function action(label,fn,secondary=false,parent=app){const b=element('button',secondary?'action secondary':'action',label,parent);b.type='button';b.addEventListener('click',fn);return b}
function optionsFor(item){return item.choices.map(c=>typeof c==='string'?{text:c}:c)}
function bestIndex(item){return typeof item.correct==='number'?item.correct:optionsFor(item).findIndex(c=>c.best)}

element('h2','','Remember this');

return}

if(stage==='results'){const correct=quizAnswers.filter((a,i)=>a===bestIndex(quizItems[i])).length;element('div','eyebrow','LESSON COMPLETE');element('h1','',lessonTitle);element('p','summary','Independent knowledge check: '+correct+' of '+quizItems.length+' correct.');element('p','','Practice is for comparing perspectives, not getting everything right immediately. Your first practice choices: '+practiceScore+' of '+scenarioItems.length+' strongest.');element('h2','','Review your answers');quizItems.forEach((q,i)=>{const opts=optionsFor(q),right=bestIndex(q),answer=quizAnswers[i];const box=element('section','feedback');element('strong','',String(i+1)+'. '+(q.q||q.question),box);element('p','', 'Your answer: '+(opts[answer]?.text||'No answer')+(answer===right?' — Correct':' — Review this'),box);element('p','', 'Recommended: '+opts[right].text,box);element('p','',q.why||opts[right].why||opts[right].feedback||'',box)});element('h2','','Live it: a 30-second practice');element('p','','Think of one moment when you felt certain about another person’s intentions. Silently name one fact you observed and one story you added. Then think of one other possible explanation. You do not need to contact or confront anyone.');element('p','summary','Try this phrase: “What do I know, and what am I guessing?”');element('h2','','Remember it later');element('p','','Tomorrow or next week, return and try the scenarios again. See whether you notice more possibilities before choosing a response.');action('Practice again',restart);action('Back to all lessons',()=>{location.href='../../'},true);return}
const isQuiz=stage==='quiz',item=(isQuiz?quizItems:scenarioItems)[index],opts=optionsFor(item);
element('div','eyebrow',isQuiz?'INDEPENDENT KNOWLEDGE CHECK '+(index+1)+' OF '+quizItems.length:'PRACTICE SITUATION '+(index+1)+' OF '+scenarioItems.length);progress();
element('h1','',isQuiz?'Check your understanding':item.title||'Explore the situation');if(!isQuiz&&item.scene)element('p','',item.scene);element('p','question',item.question||item.q);
if(isQuiz){element('p','explore','Choose one answer, then submit it. Explanations and correct answers appear only after all questions.');}
else{element('p','explore','Explore all '+opts.length+' responses and compare their tradeoffs before continuing.');}
const holder=element('div','options');
opts.forEach((c,i)=>{const b=element('button','option'+(selected===i?' chosen':''),c.text,holder);b.type='button';b.setAttribute('aria-pressed',String(selected===i));if(isQuiz&&submitted)b.disabled=true;b.addEventListener('click',()=>{if(isQuiz){if(submitted)return;selected=i;render();return}if(!firstChoiceRecorded){if(i===bestIndex(item))practiceScore++;firstChoiceRecorded=true}selected=i;viewed.add(i);render()})});
if(isQuiz){const b=action('Submit answer',()=>{if(selected<0)return;quizAnswers[index]=selected;advance()});b.disabled=selected<0;if(selected<0)element('p','muted','Select an answer to enable submission.');return}

const b=action(index===scenarioItems.length-1?'Continue to independent knowledge check':'Next situation',advance);b.disabled=viewed.size<opts.length;
}
