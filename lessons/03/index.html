'use strict';
const scenarios=[
{title:'The sharp reply',scene:'You ask someone at home a simple question. They answer in a sharp tone. You feel hurt and angry.',question:'What is the most helpful first move?',choices:[{t:'Tell them they are always disrespectful.',good:false,why:'An absolute accusation can turn one tense moment into a larger conflict.'},{t:'Notice your anger, pause, and ask whether something is wrong.',good:true,why:'You recognize your feeling without assuming you know their intention.'},{t:'Pretend you feel nothing and never mention it.',good:false,why:'Suppressing your feelings may avoid the moment, but it does not help you understand or address it.'}],lesson:'A feeling is real. The explanation you give it may still need checking.'},
{title:'The plan that changed',scene:'A friend cancels plans at the last minute. You feel disappointed and unimportant.',question:'Which response protects both your feelings and the relationship?',choices:[{t:'Say, “I was looking forward to seeing you. Is everything okay?”',good:true,why:'You communicate your disappointment while making room for information you do not yet have.'},{t:'Decide the friendship means nothing to them.',good:false,why:'That is a conclusion about their motives, not a fact you have confirmed.'},{t:'Agree to every future cancellation without discussing it.',good:false,why:'Understanding another person does not require ignoring your own needs or boundaries.'}],lesson:'You can be kind and still explain what matters to you.'},
{title:'The overwhelmed moment',scene:'Several people need your help at once. You feel pressure rising and notice that you want to snap at someone.',question:'What is the strongest next step?',choices:[{t:'Keep saying yes until you cannot cope.',good:false,why:'Ignoring your limits makes it harder to respond thoughtfully and sustainably.'},{t:'Snap at the nearest person so they understand the pressure.',good:false,why:'The pressure is real, but directing it at someone else may create new harm.'},{t:'Name the pressure, take a brief pause, and decide what you can realistically do.',good:true,why:'A short pause helps you act within your limits instead of reacting from overload.'}],lesson:'A boundary can be an act of respect for yourself and others.'}
];
