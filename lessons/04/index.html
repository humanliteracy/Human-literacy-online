<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf8f5">
<title>Lesson 04 — Understanding Boundaries | Human Literacy</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#18353a;background:#eaf8f5;font-size:18px}*{box-sizing:border-box}body{margin:0}main{max-width:750px;margin:auto;padding:22px 16px 45px}.brand{color:#087f78;font-weight:800;letter-spacing:.13em;font-size:.81rem;margin-bottom:24px}.panel{background:#fff;border:1px solid #cce6df;border-radius:27px;padding:26px 22px;box-shadow:0 10px 26px #164c4510}.eyebrow{color:#087f78;font-weight:800;letter-spacing:.06em;font-size:.85rem}h1{font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.2;margin:14px 0 22px}h2{font-size:1.3rem;line-height:1.3;margin:18px 0}p{line-height:1.65}.question{font-weight:650}.options{display:grid;gap:12px;margin-top:22px}.option{font:inherit;color:inherit;text-align:left;background:#fff;border:2px solid #cbe5df;border-radius:18px;padding:18px;line-height:1.55;cursor:pointer}.option:hover,.option:focus-visible{border-color:#07887d;outline-offset:3px}.option[disabled]{cursor:default}.option.chosen{border-color:#087f78;background:#effaf7}.option:focus-visible,.action:focus-visible{outline:3px solid #1a8079}.feedback{border-left:4px solid #087f78;background:#eff8f5;padding:16px 18px;border-radius:12px;margin-top:22px}.explore{color:#416f70;font-size:.94rem;line-height:1.5;margin:18px 0 0}.feedback h3{margin:0 0 8px;font-size:1.08rem}.feedback p{margin:0}.action{display:block;width:100%;margin-top:22px;border:0;border-radius:16px;padding:17px;background:#087f78;color:white;font:inherit;font-weight:750;cursor:pointer}.action.secondary{background:#e3f3ef;color:#075b55}.progress{height:10px;border-radius:99px;background:#d8ebe6;overflow:hidden;margin:9px 0 25px}.fill{height:100%;background:#087f78;transition:width .2s}.muted{color:#607b7e;font-size:.87rem}.summary{font-weight:750;font-size:1.1rem}.hidden{display:none}footer{margin-top:30px;color:#5b797b;font-size:.82rem;line-height:1.5}@media(max-width:430px){main{padding:18px 12px 35px}.panel{padding:24px 19px}.option{padding:16px}}
</style>
</head>
<body><main><div class="brand">HUMAN LITERACY · INTERACTIVE LESSON</div><section class="panel" id="app" aria-live="polite"></section><footer>Educational practice, not a diagnosis or individualized professional advice. Your choices stay on this device; no account required.</footer></main>
<script>
'use strict';
const scenarios=[
 {title:'The last-minute favor',scene:'You have had a demanding day. A friend asks you to drive across town tonight. You care about them, but you need rest.',question:'Which response best protects your capacity while respecting your friend?',choices:[
  {text:'“I can take you tonight, but I’ll need you to return the favor sometime.”',quality:'Consider the tradeoff',why:'A reciprocal arrangement can be fair, but it does not address your need for rest tonight. Saying yes out of obligation can turn into resentment.'},
  {text:'“I can’t drive tonight. I can help you explore another way to get there.”',quality:'Strongest response',best:true,why:'You state a clear limit and offer support you can realistically give. Caring does not require sacrificing your own well-being.'},
  {text:'“I could take you tomorrow morning if that works for you.”',quality:'Reasonable, with a condition',why:'Offering another time can work if you truly have the capacity and the trip can wait. It is not a good alternative if you are only postponing an unwanted obligation.'}
 ]},
 {title:'The private conversation',scene:'A relative begins sharing personal details about someone else. They say you should know because you are family. You want to stay connected without spreading private information.',question:'What is the most respectful response?',choices:[
  {text:'“I want to be supportive. Can we focus on what you need without discussing their private details?”',quality:'Strongest response',best:true,why:'You acknowledge the relative’s feelings, redirect toward what they need, and avoid taking ownership of another person’s private information.'},
  {text:'“You can tell me, but I promise I won’t repeat any of it.”',quality:'Consider the tradeoff',why:'Keeping a confidence is valuable, but agreeing to receive information is not the same as having the other person’s permission to share it.'},
  {text:'“I’d rather not get involved in this. Let’s talk about something else.”',quality:'A valid boundary, but abrupt',why:'You have every right not to participate. The abrupt shift, though, may overlook the relative’s underlying need for support.'}
 ]},
 {title:'When someone says no',scene:'You invite a friend to a gathering. They decline without explaining why. You feel disappointed and wonder whether something is wrong.',question:'Which response best respects their decision and your relationship?',choices:[
  {text:'“I understand. I’ll leave the invitation open in case you change your mind.”',quality:'Kind, but watch the pressure',why:'This can be warm, but repeatedly keeping the invitation open may make a clear no feel negotiable. Respect their decision without expecting it to change.'},
  {text:'“I was looking forward to seeing you. Is everything okay between us?”',quality:'Understandable, but consider timing',why:'You can express your feelings, but immediately asking for reassurance may place responsibility for your disappointment on the other person.'},
  {text:'“Thanks for letting me know. We can catch up another time if you’d like.”',quality:'Strongest response',best:true,why:'You accept the no without demanding a reason. You also leave room for future connection without making it an obligation.'}
 ]}
];
const quiz=[
 {q:'Which statement best describes a healthy boundary?',choices:[{text:'“A rule that makes other people behave the way I need.”',why:'That tries to control someone else’s behavior rather than define your own limits.'},{text:'“A clear limit about what I can do or accept, while recognizing others have choices too.”',best:true,why:'Boundaries guide your actions and availability; they do not guarantee agreement from others.'},{text:'“An agreement that prevents anyone from feeling disappointed.”',why:'Healthy boundaries can still lead to disappointment. They are not a promise that nobody will be upset.'}]},
 {q:'Someone is upset after you decline a request. What matters most?',choices:[{text:'“I should explain myself until they agree that my reason is good enough.”',why:'You can offer context, but you do not need to win approval before a reasonable limit counts.'},{text:'“I should change my answer if they are hurt by it.”',why:'Their feelings matter, but another person’s disappointment does not automatically mean your limit is wrong.'},{text:'“I can acknowledge their feelings while maintaining a limit I can genuinely keep.”',best:true,why:'Empathy and self-respect can coexist, even when the other person remains disappointed.'}]},
 {q:'A friend declines an invitation without giving a reason. What is a respectful response?',choices:[{text:'“Thanks for telling me. Maybe another time.”',best:true,why:'It respects the decision without demanding an explanation or implying they owe you one.'},{text:'“I understand, but please tell me why so I know we are okay.”',why:'Wanting reassurance is understandable, but it puts pressure on someone who already said no.'},{text:'“No problem. I’ll keep checking in until you feel ready.”',why:'Frequent follow-ups can undermine a boundary even when your intentions are caring.'}]}
];
let stage='scenario',index=0,selected=-1,viewed=new Set(),practice=0,knowledge=0;const app=document.getElementById('app');
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function button(text,fn,secondary=false){const b=el('button','action'+(secondary?' secondary':''),text);b.type='button';b.addEventListener('click',fn);return b}
function reset(){app.replaceChildren()}
function render(){reset(); if(stage==='done'){app.append(el('div','eyebrow','LESSON COMPLETE'),el('h1','','Respect for self and others'),el('p','summary',`First choices: ${practice} of 3 strongest in practice · ${knowledge} of 3 correct in the knowledge check`),el('p','','Your first selection determines the score. Exploring other answers helps you understand their benefits and tradeoffs without changing that score. Boundaries combine honesty, respect for yourself, and respect for others.'),button('Practice again',()=>{stage='scenario';index=0;selected=-1;viewed=new Set();practice=0;knowledge=0;render()}),button('Back to lesson library',()=>{window.location.href='../../'},true));return}
 const isQuiz=stage==='quiz',item=(isQuiz?quiz:scenarios)[index],count=3;
 app.append(el('div','eyebrow',isQuiz?`KNOWLEDGE CHECK ${index+1} OF ${count}`:`SITUATION ${index+1} OF ${count}`));const progress=el('div','progress');progress.setAttribute('role','progressbar');progress.setAttribute('aria-label','Lesson progress');progress.setAttribute('aria-valuenow',String((isQuiz?3:0)+index));progress.setAttribute('aria-valuemin','0');progress.setAttribute('aria-valuemax','6');const fill=el('div','fill');fill.style.width=`${((isQuiz?3:0)+index)/6*100}%`;progress.append(fill);app.append(progress);
 if(!isQuiz){app.append(el('h1','',item.title),el('p','',item.scene))}else{app.append(el('h1','','Check your understanding'))}app.append(el('p','question',item.question||item.q));const options=el('div','options');item.choices.forEach((c,i)=>{const b=el('button','option'+(selected===i?' chosen':''),c.text);b.type='button';b.setAttribute('aria-pressed',String(selected===i));b.addEventListener('click',()=>{if(viewed.size===0&&c.best){if(isQuiz)knowledge++;else practice++}selected=i;viewed.add(i);render()});options.append(b)});app.append(options);
 if(selected!==-1){app.append(el('p','explore',`Explored ${viewed.size} of ${item.choices.length} choices. Tap any answer to compare its explanation.`));const c=item.choices[selected],fb=el('section','feedback');fb.append(el('h3','',c.quality||(c.best?'Strongest response':'Consider the tradeoff')),el('p','',c.why));if(!c.best){const best=item.choices.find(x=>x.best);fb.append(el('p','',`Another approach: ${best.text} ${best.why}`))}app.append(fb,button(index===2?(isQuiz?'See lesson summary':'Continue to knowledge check'):'Next',()=>{selected=-1;viewed=new Set();if(index===2){stage=isQuiz?'done':'quiz';index=0}else index++;render()}))}
 }
render();
</script></body></html>
