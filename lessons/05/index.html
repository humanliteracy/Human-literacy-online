<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf8f5">
<title>Lesson 05 — Listening to Understand | Human Literacy</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#18353a;background:#eaf8f5;font-size:18px}*{box-sizing:border-box}body{margin:0}main{max-width:750px;margin:auto;padding:22px 16px 45px}.brand{color:#087f78;font-weight:800;letter-spacing:.13em;font-size:.81rem;margin-bottom:24px}.panel{background:#fff;border:1px solid #cce6df;border-radius:27px;padding:26px 22px;box-shadow:0 10px 26px #164c4510}.eyebrow{color:#087f78;font-weight:800;letter-spacing:.06em;font-size:.85rem}h1{font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.2;margin:14px 0 22px}h2{font-size:1.3rem;line-height:1.3;margin:18px 0}p{line-height:1.65}.question{font-weight:650}.options{display:grid;gap:12px;margin-top:22px}.option{font:inherit;color:inherit;text-align:left;background:#fff;border:2px solid #cbe5df;border-radius:18px;padding:18px;line-height:1.55;cursor:pointer}.option:hover,.option:focus-visible{border-color:#07887d;outline-offset:3px}.option[disabled]{cursor:default}.option.chosen{border-color:#087f78;background:#effaf7}.option:focus-visible,.action:focus-visible{outline:3px solid #1a8079}.feedback{border-left:4px solid #087f78;background:#eff8f5;padding:16px 18px;border-radius:12px;margin-top:22px}.explore{color:#416f70;font-size:.94rem;line-height:1.5;margin:18px 0 0}.feedback h3{margin:0 0 8px;font-size:1.08rem}.feedback p{margin:0}.action{display:block;width:100%;margin-top:22px;border:0;border-radius:16px;padding:17px;background:#087f78;color:white;font:inherit;font-weight:750;cursor:pointer}.action.secondary{background:#e3f3ef;color:#075b55}.progress{height:10px;border-radius:99px;background:#d8ebe6;overflow:hidden;margin:9px 0 25px}.fill{height:100%;background:#087f78;transition:width .2s}.muted{color:#607b7e;font-size:.87rem}.summary{font-weight:750;font-size:1.1rem}.hidden{display:none}footer{margin-top:30px;color:#5b797b;font-size:.82rem;line-height:1.5}@media(max-width:430px){main{padding:18px 12px 35px}.panel{padding:24px 19px}.option{padding:16px}}
button:disabled{opacity:.45;cursor:not-allowed}.feedback p{margin:8px 0}.feedback strong{display:block;margin-bottom:8px}.lesson-heading{font-weight:800;font-size:clamp(1rem,3.8vw,1.18rem);line-height:1.45;color:#18353a;margin:-12px 0 22px;padding-bottom:15px;border-bottom:1px solid #cce6df}button:disabled{opacity:.48;cursor:not-allowed}</style>
</head>
<body><main><div class="brand">HUMAN LITERACY · INTERACTIVE LESSON</div><div class="lesson-heading" aria-label="Lesson number and title">LESSON 05 · Listening to Understand</div><section class="panel" id="app" aria-live="polite"></section><footer>Educational practice, not a diagnosis or individualized professional advice. Your choices stay on this device; no account required.</footer></main>
<script>
'use strict';
const scenarios=[
 {
  "title": "The interrupted story",
  "scene": "A friend is describing a difficult day. You think you know exactly what they should do, but they have not finished speaking.",
  "question": "What response best helps you understand them first?",
  "choices": [
   {
    "text": "“I have been through that. Let me tell you what worked for me.”",
    "quality": "Consider the tradeoff",
    "why": "Your experience might help later, but leading with your story can shift attention away before you know what your friend needs."
   },
   {
    "text": "“That sounds exhausting. What part has been hardest for you?”",
    "best": true,
    "quality": "Strongest response",
    "why": "You acknowledge what you heard and invite them to explain their own experience. You can discuss solutions after you understand it."
   },
   {
    "text": "“I think I know how to fix this, but I will wait until you finish.”",
    "quality": "Helpful intention, limited listening",
    "why": "Not interrupting is useful, but announcing that you have the fix can make the person feel you have already decided what matters."
   }
  ]
 },
 {
  "title": "The misunderstood request",
  "scene": "Someone at home says, “You never help when I need you.” You remember helping yesterday and feel unfairly criticized.",
  "question": "Which first response is most likely to uncover the real concern?",
  "choices": [
   {
    "text": "“I helped yesterday, so saying never is unfair.”",
    "quality": "Consider the tradeoff",
    "why": "The word “never” may be inaccurate, but correcting it immediately can turn the conversation into a contest about evidence instead of revealing today’s unmet need."
   },
   {
    "text": "“I hear that you feel unsupported. What did you need from me today?”",
    "best": true,
    "quality": "Strongest response",
    "why": "You do not have to agree with “never” to recognize their frustration. A specific question makes the need clearer before you discuss what is realistic."
   },
   {
    "text": "“I am sorry. I will do more so you do not feel this way again.”",
    "quality": "Caring, but premature",
    "why": "An apology may calm things briefly, yet promising more before knowing the request can create commitments you cannot keep."
   }
  ]
 },
 {
  "title": "The quiet friend",
  "scene": "During a group outing, a normally talkative friend becomes quiet. You wonder if you upset them, but they have not said anything.",
  "question": "What is the most respectful way to check in?",
  "choices": [
   {
    "text": "“You seem quieter than usual. Would you like to talk, or would you prefer some space?”",
    "best": true,
    "quality": "Strongest response",
    "why": "You share an observation without assigning a cause and offer two acceptable choices. Their silence does not have to be about you."
   },
   {
    "text": "“Are you upset with me? I need to know if I did something.”",
    "quality": "Understandable, but self-focused",
    "why": "Seeking reassurance is natural, but the question centers your worry and may pressure them to comfort you."
   },
   {
    "text": "“I will leave you alone until you decide to tell me what is wrong.”",
    "quality": "Respects space, but assumes a problem",
    "why": "Giving space can be kind, yet assuming something is wrong and waiting indefinitely can miss a simple chance to check whether they want company."
   }
  ]
 }
];
const quiz=[
 {
  "q": "Someone pauses while telling you about a problem. What is the best next step?",
  "choices": [
   {
    "text": "“Fill the silence with advice so they know you care.”",
    "why": "Advice can be useful, but silence may mean they are thinking. Jumping in can cut off information you have not heard."
   },
   {
    "text": "“Give them a moment, then ask whether they want to continue.”",
    "best": true,
    "why": "A little space respects their pace and gives them control over what they share."
   },
   {
    "text": "“Repeat your own interpretation so they can confirm it quickly.”",
    "why": "Checking understanding can help, but rushing to your interpretation may interrupt a thought they were still forming."
   }
  ]
 },
 {
  "q": "You disagree with how a friend describes an event. What response supports understanding?",
  "choices": [
   {
    "text": "“I remember it differently. Can you tell me what led you to see it that way?”",
    "best": true,
    "why": "You can be honest about your perspective while staying curious about theirs. Understanding does not require agreement."
   },
   {
    "text": "“That is not what happened. Let me explain the facts first.”",
    "why": "Facts matter, but leading with a correction may stop you from hearing why their experience felt different."
   },
   {
    "text": "“You are right. I do not want to make this into an argument.”",
    "why": "Avoiding conflict by agreeing can hide your genuine view and does not build shared understanding."
   }
  ]
 },
 {
  "q": "After someone tells you something painful, how can you check what kind of support they want?",
  "choices": [
   {
    "text": "“I know what you should do. Can I walk you through it?”",
    "why": "Asking permission is better than forcing advice, but “I know” presumes you understand the solution before checking their needs."
   },
   {
    "text": "“You can tell me anything. I promise I can help you fix it.”",
    "why": "Warmth matters, but a promise to fix the situation may be unrealistic and can create pressure."
   },
   {
    "text": "“Would it help more if I listened, helped you think through options, or gave you some space?”",
    "best": true,
    "why": "This offers practical forms of support without deciding for them. It also respects that they may not want advice right now."
   }
  ]
 }
];

const app=document.getElementById('app');
const scenarioItems=typeof DATA!=='undefined'?DATA.scenarios:scenarios;
const quizItems=typeof DATA!=='undefined'?DATA.quiz:quiz;
let stage='practice',index=0,selected=-1,viewed=new Set(),practiceScore=0,quizAnswers=[],submitted=false,firstChoiceRecorded=false;
const lessonTitle=document.title.replace(/^Lesson \d+ — /,'').replace(/ \| Human Literacy$/,'');
function element(tag,cls,txt,parent=app){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;parent.append(e);return e}
function action(label,fn,secondary=false,parent=app){const b=element('button',secondary?'action secondary':'action',label,parent);b.type='button';b.addEventListener('click',fn);return b}
function optionsFor(item){return item.choices.map(c=>typeof c==='string'?{text:c}:c)}
function bestIndex(item){return typeof item.correct==='number'?item.correct:optionsFor(item).findIndex(c=>c.best)}
function resetSelection(){selected=-1;viewed=new Set();firstChoiceRecorded=false;submitted=false}
function advance(){index++;resetSelection();if(stage==='practice'&&index===scenarioItems.length){stage='quiz';index=0}else if(stage==='quiz'&&index===quizItems.length){stage='results';index=0}render();window.scrollTo(0,0)}
function restart(){stage='practice';index=0;practiceScore=0;quizAnswers=[];resetSelection();render();window.scrollTo(0,0)}
function progress(){const total=scenarioItems.length+quizItems.length,done=(stage==='quiz'?scenarioItems.length:0)+index;const p=element('div','progress');p.setAttribute('role','progressbar');p.setAttribute('aria-label','Lesson progress');p.setAttribute('aria-valuemin','0');p.setAttribute('aria-valuemax',String(total));p.setAttribute('aria-valuenow',String(done));const fill=element('div','fill');fill.style.width=(100*done/total)+'%';p.append(fill)}
function render(){app.replaceChildren();
if(stage==='results'){const correct=quizAnswers.filter((a,i)=>a===bestIndex(quizItems[i])).length;element('div','eyebrow','LESSON COMPLETE');element('h1','',lessonTitle);element('p','summary','Independent knowledge check: '+correct+' of '+quizItems.length+' correct.');element('p','','Practice is for comparing perspectives, not getting everything right immediately. Your first practice choices: '+practiceScore+' of '+scenarioItems.length+' strongest.');element('h2','','Review your answers');quizItems.forEach((q,i)=>{const opts=optionsFor(q),right=bestIndex(q),answer=quizAnswers[i];const box=element('section','feedback');element('strong','',String(i+1)+'. '+(q.q||q.question),box);element('p','', 'Your answer: '+(opts[answer]?.text||'No answer')+(answer===right?' — Correct':' — Review this'),box);element('p','', 'Recommended: '+opts[right].text,box);element('p','',q.why||opts[right].why||opts[right].feedback||'',box)});element('h2','','Take it into everyday life');element('p','','Think of one real situation this week. What did you notice? What did you assume? What respectful next step could you try? You can reflect silently or discuss it with someone.');action('Practice again',restart);action('Back to all lessons',()=>{location.href='../../'},true);return}
const isQuiz=stage==='quiz',item=(isQuiz?quizItems:scenarioItems)[index],opts=optionsFor(item);
element('div','eyebrow',isQuiz?'INDEPENDENT KNOWLEDGE CHECK '+(index+1)+' OF '+quizItems.length:'PRACTICE SITUATION '+(index+1)+' OF '+scenarioItems.length);progress();
element('h1','',isQuiz?'Check your understanding':item.title||'Explore the situation');if(!isQuiz&&item.scene)element('p','',item.scene);element('p','question',item.question||item.q);
if(isQuiz){element('p','explore','Choose one answer, then submit it. Explanations and correct answers appear only after all questions.');}
else{element('p','explore','Explore all '+opts.length+' responses and compare their tradeoffs before continuing.');}
const holder=element('div','options');
opts.forEach((c,i)=>{const b=element('button','option'+(selected===i?' chosen':''),c.text,holder);b.type='button';b.setAttribute('aria-pressed',String(selected===i));if(isQuiz&&submitted)b.disabled=true;b.addEventListener('click',()=>{if(isQuiz){if(submitted)return;selected=i;render();return}if(!firstChoiceRecorded){if(i===bestIndex(item))practiceScore++;firstChoiceRecorded=true}selected=i;viewed.add(i);render()})});
if(isQuiz){const b=action('Submit answer',()=>{if(selected<0)return;quizAnswers[index]=selected;advance()});b.disabled=selected<0;if(selected<0)element('p','muted','Select an answer to enable submission.');return}
if(selected>=0){const c=opts[selected],box=element('section','feedback');element('h3','',c.rating||c.quality||(c.best?'Strongest response':'Consider the tradeoff'),box);element('p','',c.why||c.feedback||'',box)}
element('p','explore','Compared '+viewed.size+' of '+opts.length+' responses'+(viewed.size<opts.length?'. Select the remaining responses to unlock Next.':'. You are ready to continue.'));
const b=action(index===scenarioItems.length-1?'Continue to independent knowledge check':'Next situation',advance);b.disabled=viewed.size<opts.length;
}
render();
</script></body></html>
