& Utilities':'Housing + Utilities','Aging & Accessibility':'Aging + Accessibility','Community & Civic Life':'Community + Civic'};if(team){main.className='inside';main.innerHTML='<a class="back" href="index.html">← All life areas</a><p class="eyebrow" style="margin-top:25px">THE PEOPLE AND TOOLS BEHIND THIS</p><h1>One person. AI tools. A mission to help everyone.</h1><p class="desc">ONE PLACE is led by one human founder. ChatGPT and other AI tools help research, write, design, code and prototype the site. The founder decides what to publish and remains accountable for it.</p><div class="teamgrid"><article><h2>♥ The human founder</h2><p>Sets the vision, values and priorities. Reviews decisions and owns responsibility for this project.</p></article><article><h2>✳ ChatGPT + AI</h2><p>Helps produce drafts, design tools, test prototypes and catch problems. AI is not a person or licensed professional.</p></article><article><h2>◎ Our shared purpose</h2><p>Help people find better next steps across life and business, whether the resource is free or a future paid tool.</p></article></div><p class="notice">Founder-only preview. The founder and AI tools are the project team, but not a claim that every resource or service has been individually checked or is available. No purchase or booking is possible.</p>';}

else{main.className='home';main.innerHTML='<section class="hero"><p class="eyebrow">ONE HOME FOR LIFE’S MANY NEEDS</p><h1>What do you need <em>help with?</em></h1><p class="desc">Personal or business. Choose an area below. Free guidance first; paid tools and services are previews only.</p><form class="search" id="finder" role="search"><label for="term" class="sr">Search every service</label><input id="term" type="search" autocomplete="off" placeholder="Search any need: bills, jobs, caregiving, business…"><button type="submit">Find help</button></form><div class="results" id="results" hidden></div></section><section><div class="section-title"><h2>Explore every part of life</h2><small>18 areas · 72 ways to start</small></div><div class="grid">'+source.map(a=>'<a class="tile" href="'+uArea(a[0])+'" aria-label="'+esc(a[0])+', four options"><span class="emoji" aria-hidden="true">'+a[1]+'</span><strong>'+esc(quickNames[a[0]]||a[0].replace(' & ',' + '))+'</strong><small>4 ways to begin</small><span class="arrow" aria-hidden="true">↗</span></a>').join('')+'</div></section>';let hits=[];const input=$('term'),results=$('results');const update=()=>{let text=input.value.trim().toLowerCase();if(!text){results.hidden=true;results.innerHTML='';hits=[];return}hits=all.filter(x=>(x.title+' '+x.area).toLowerCase().includes(text)).slice(0,10);results.hidden=false;results.innerHTML=hits.length?hits.map(x=>'<a href="'+uService(x.id)+'"><strong>'+esc(x.title)+'</strong><small>'+esc(x.area)+' · '+kinds[x.kind]+'</small></a>').join(''):'<p style="padding:8px">No exact result. Try a life area below.</p>'};input.addEventListener('input',update);$('finder').addEventListener('submit',e=>{e.preventDefault();if(hits.length)location.href=uService(hits[0].id);else update()});}
function renderDemo(title){let fields=[],mode='text';if(title==='Job Pricing Calculator'){fields=[['materials','Materials',85],['hours','Work hours',4],['labor','Cost per hour',24],['overhead','Overhead',35],['margin','Margin %',30]];mode='pricing'}else if(title==='Household Budget Studio'){fields=[['income','Monthly income',5000],['housing','Housing',1700],['living','Living expenses',1350],['debt','Debt payments',1200]];mode='budget'}else if(title==='Family Handoff Toolkit'){fields=[['person','Responsible person','Care partner'],['priority','Next priority','Check appointment'],['backup','Backup','Family backup']]}else if(title==='Application Tracker'){fields=[['company','Company','Example employer'],['stage','Status','Researching']]}else if(title==='Home Maintenance Planner'){fields=[['month','Month','November'],['task','Task','Check smoke alarms']]}else if(title==='Legacy Story Builder'){fields=[['memory','Story title','A day I remember'],['lesson','Lesson','Keep going']]}else{document.getElementById('demoHost').innerHTML='<div class="output">Concept preview. This product has not been built or launched.</div>';return}
