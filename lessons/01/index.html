<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf8f5"><title>Lesson 01 — Understanding Before Reacting | Human Literacy</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#18353a;background:#eaf8f5;font-size:18px}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:22px 17px 55px}.brand{font-size:.8rem;font-weight:850;color:#087f79;letter-spacing:.11em;text-transform:uppercase;margin-bottom:20px}.panel{background:white;border:1px solid #cce6e0;border-radius:24px;padding:clamp(23px,5vw,38px);box-shadow:0 12px 28px #124d4020}h1{font-size:clamp(1.8rem,6vw,2.5rem);line-height:1.17}h2{font-size:clamp(1.45rem,5vw,2rem);line-height:1.22}p{line-height:1.65}.eyebrow{font-size:.82rem;font-weight:850;letter-spacing:.07em;color:#087f79;text-transform:uppercase}.muted{color:#587276}.bar{height:9px;background:#d6eae5;border-radius:10px;overflow:hidden;margin:8px 0 24px}.fill{height:100%;background:#087f79;transition:width .2s}.scene{font-size:1.06rem;line-height:1.65;margin:24px 0}.choices{display:grid;gap:12px;margin:22px 0}button{font:inherit;cursor:pointer;border-radius:14px;min-height:58px;padding:16px 18px;text-align:left;border:2px solid #cde6df;background:white;color:#18353a;line-height:1.45}button:focus-visible{outline:3px solid #c48d20;outline-offset:3px}button:hover{border-color:#087f79}.primary{background:#087f79;color:white;border-color:#087f79;text-align:center;font-weight:800;width:100%}.secondary{border-color:#087f79;color:#087f79;text-align:center;font-weight:700;width:100%}.feedback{background:#eff8f5;border-left:4px solid #087f79;padding:18px;border-radius:12px;margin:20px 0}.feedback strong{color:#076d66}.meta{font-size:.84rem;color:#607779;margin-top:26px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.stat{background:#eff8f5;border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:1.6rem;color:#087f79}.stat span{font-size:.78rem}.choice-label{display:block}.tip{padding:16px;background:#eff8f5;border-radius:12px;margin:20px 0}
</style></head><body><main><div class="brand">Human Literacy · Interactive Lesson</div><section id="app" class="panel" aria-live="polite"></section><p class="meta">Practice, not diagnosis or individualized professional advice. Your answers stay on this page; no account required.</p></main><script>
'use strict';const DATA={"scenarios": [{"title": "The misunderstood message", "scene": "A friend says you rarely respond promptly. Yesterday you were helping someone and did not check your phone. You feel unfairly criticized.", "question": "How would you reply?", "choices": [{"text": "“I was helping someone yesterday. I can explain, but first tell me what worried you.”", "rating": "Strongest response", "why": "You acknowledge their concern, give relevant context, and invite clarification without accepting the sweeping accusation.", "points": 2}, {"text": "“I was helping someone yesterday. I understand the delay was frustrating, but I need you to be patient.”", "rating": "Partly effective", "why": "You explain the delay and acknowledge frustration, but asking for patience before exploring their concern can close the conversation too early.", "points": 1}, {"text": "“I hear that you felt ignored. Next time, I will send a quick reply when I can.”", "rating": "Partly effective", "why": "You acknowledge the feeling and offer a modest change, but you have not asked what actually concerned your friend.", "points": 1}]}, {"title": "The extra errand", "scene": "A relative asks you to cancel plans to run a nonurgent errand. You often help, but today you already have an important commitment.", "question": "What is the most respectful response?", "choices": [{"text": "“I cannot cancel my plans, but I can fit the errand in afterward if it is important.”", "rating": "Partly effective", "why": "You protect the prior commitment, but agreeing to another obligation may still exceed your capacity.", "points": 1}, {"text": "“I cannot cancel today. I can help tomorrow afternoon if that timing works.”", "rating": "Strongest response", "why": "You state a clear, realistic limit and offer help you can actually provide.", "points": 2}, {"text": "“I have a commitment today. Could someone else help, or can the errand wait?”", "rating": "Reasonable alternative", "why": "You respect your commitment and invite alternatives, but leave the next arrangement unresolved.", "points": 1}]}, {"title": "The urgent warning", "scene": "An alarming social media post claims a familiar household product is dangerous. It includes a screenshot of a supposed study but no link or publication date.", "question": "What should you do before passing it along?", "choices": [{"text": "“I will share the post as a question so others can help verify it.”", "rating": "Partly effective", "why": "Framing an unverified claim as a question can still spread misinformation to people who never see the correction.", "points": 1}, {"text": "“I will check whether a respected news outlet has reported the same findings.”", "rating": "Partly effective", "why": "News coverage can provide context, but checking the underlying study and independent evidence is stronger than relying on coverage alone.", "points": 1}, {"text": "“I will trace the study, check its date and findings, and compare reliable independent sources.”", "rating": "Strongest response", "why": "You test the claim rather than trusting or dismissing it based on its emotional presentation.", "points": 2}]}], "quiz": [{"q": "A friend sounds hurt by a delayed reply. Which response is most constructive?", "choices": ["“I was occupied, but I see how the silence might have felt dismissive.”", "“I want to understand what upset you, then I can explain what happened.”", "“I will try to respond sooner, and I hope that resolves the misunderstanding.”"], "correct": 1, "why": "Acknowledging feelings helps, but asking what upset the person before committing to a solution leaves room for both perspectives."}, {"q": "A relative asks for help when you have a prior commitment. Which is the strongest boundary?", "choices": ["“I can rearrange today if it matters a lot to you.”", "“I cannot help today, but I will make tomorrow work somehow.”", "“I cannot change today’s plans. I can help with this tomorrow afternoon.”"], "correct": 2, "why": "A clear limit paired with a realistic, specific offer is more sustainable than rearranging obligations or promising unlimited help."}, {"q": "An alarming post cites an unnamed study. What is the strongest first move?", "choices": ["“I will look for the original study and independent confirmation before sharing.”", "“I will ask trusted friends whether they have seen the same warning.”", "“I will check the author’s credentials before deciding whether to share.”"], "correct": 0, "why": "Tracing the original evidence and checking independent confirmation is stronger than relying on social proof or credentials alone."}]};const app=document.getElementById('app');let stage='scenario',idx=0,selected=null,practice=0,knowledge=0;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function btn(t,fn,cls='primary'){let b=document.createElement('button');b.className=cls;b.textContent=t;b.addEventListener('click',fn);return b}
function el(tag,txt,cls){let e=document.createElement(tag);if(cls)e.className=cls;e.textContent=txt;return e}
function appendText(tag,txt,cls){app.append(el(tag,txt,cls))}
function next(){idx++;selected=null;if(idx===3){idx=0;stage='quiz'}else stage='scenario';render()}
function reset(){stage='scenario';idx=0;selected=null;practice=0;knowledge=0;render()}
function render(){app.replaceChildren();if(stage==='intro'){appendText('div','Lesson 01 · About 5 minutes','eyebrow');appendText('h1',"Understanding Before Reacting");appendText('p',"Listen, set limits, and check evidence before responding.");appendText('p','Choose a response in three everyday situations. Every option is plausible; the feedback explains the tradeoffs. Then complete a short knowledge check.');app.append(btn('Start lesson',()=>{stage='scenario';render()}));return}
if(stage==='scenario'){let s=DATA.scenarios[idx];appendText('div',`Situation ${idx+1} of 3`,'eyebrow');let bar=el('div','','bar'),fill=el('div','','fill');fill.style.width=`${idx/3*100}%`;bar.append(fill);app.append(bar);appendText('h2',s.title);appendText('p',s.scene,'scene');appendText('p',s.question);let choices=el('div','','choices');s.choices.forEach((c,j)=>choices.append(btn(c.text,()=>{selected=j;if(c.points===2)practice++;stage='feedback';render()},'choice')));app.append(choices);return}
if(stage==='feedback'){let s=DATA.scenarios[idx],c=s.choices[selected];appendText('div',`Situation ${idx+1} · Feedback`,'eyebrow');appendText('h2',c.rating);let fb=el('div','','feedback');fb.append(el('p',c.why));fb.append(el('p','A useful question: What does this choice protect, and what might it cost?'));app.append(fb);app.append(btn(idx===2?'Begin knowledge check':'Next situation',next));return}
if(stage==='quiz'){let q=DATA.quiz[idx];appendText('div',`Knowledge check ${idx+1} of 3`,'eyebrow');appendText('h2',q.q);let choices=el('div','','choices');q.choices.forEach((a,j)=>choices.append(btn(a,()=>{selected=j;if(j===q.correct)knowledge++;stage='answer';render()},'choice')));app.append(choices);return}
if(stage==='answer'){let q=DATA.quiz[idx];appendText('div',`Knowledge check ${idx+1} · Explanation`,'eyebrow');appendText('h2',selected===q.correct?'Strong answer':'Consider the distinction');appendText('p',q.why);let tip=el('div','','tip');tip.append(el('strong','Strongest answer:'));tip.append(el('p',q.choices[q.correct]));app.append(tip);app.append(btn(idx===2?'See learning summary':'Next question',()=>{idx++;selected=null;stage=idx===3?'result':'quiz';render()}));return}
appendText('div','Lesson complete','eyebrow');appendText('h1','You practiced thoughtful choices.');let stats=el('div','','stats');[[practice+'/3','Strongest scenario choices'],[knowledge+'/3','Knowledge check']].forEach(([n,t])=>{let box=el('div','','stat');box.append(el('b',n),el('span',t));stats.append(box)});app.append(stats);appendText('p','The point is not a perfect score. It is noticing the tradeoffs, practicing again, and carrying the skill into daily life.');app.append(btn('Practice again',reset),btn('Return to lesson library',()=>{location.href='../../'},'secondary'))}
render();</script></body></html>
