const DATA={"scenarios":[{"title":"The unanswered message","scene":"You sent a friend an important message yesterday. They have been active online but have not answered. You feel overlooked.","question":"What would you do next?","choices":[{"text":"They may have seen it, so I will give them another day before deciding what it means.","rating":"Reasonable alternative","why":"Waiting may help, but the fact that they were online does not establish why they have not replied.","points":1,"feedback":"Waiting may help, but the fact that they were online does not establish why they have not replied. Another approach: “I feel overlooked, but I do not know why they have not replied. I can follow up directly if needed.” You recognize your emotion, separate it from an unverified motive, and keep a practical next step available.","best":false},{"text":"I feel overlooked, but I do not know why they have not replied. I can follow up directly if needed.","rating":"Strongest response","why":"You recognize your emotion, separate it from an unverified motive, and keep a practical next step available.","points":2,"feedback":"You recognize your emotion, separate it from an unverified motive, and keep a practical next step available.","best":true},{"text":"I know they are busy sometimes, but I should probably lower my expectations of this friendship.","rating":"Partly effective","why":"Adjusting expectations can be healthy after a pattern, but one delay is too little information for a firm conclusion.","points":1,"feedback":"Adjusting expectations can be healthy after a pattern, but one delay is too little information for a firm conclusion. Another approach: “I feel overlooked, but I do not know why they have not replied. I can follow up directly if needed.” You recognize your emotion, separate it from an unverified motive, and keep a practical next step available.","best":false}]},{"title":"The look across the room","scene":"At a family gathering, someone looks at you briefly and turns function action(label,fn,secondary=false,parent=app){const b=element('button',secondary?'action secondary':'action',label,parent);b.type='button';b.addEventListener('click',fn);return b}
