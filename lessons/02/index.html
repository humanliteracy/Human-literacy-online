<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf8f5"><title>Lesson 02 — The Story We Tell Ourselves | Human Literacy</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#18353a;background:#eaf8f5;font-size:18px}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:22px 17px 55px}.brand{font-size:.8rem;font-weight:850;color:#087f79;letter-spacing:.11em;text-transform:uppercase;margin-bottom:20px}.panel{background:white;border:1px solid #cce6e0;border-radius:24px;padding:clamp(23px,5vw,38px);box-shadow:0 12px 28px #124d4020}h1{font-size:clamp(1.8rem,6vw,2.5rem);line-height:1.17}h2{font-size:clamp(1.45rem,5vw,2rem);line-height:1.22}p{line-height:1.65}.eyebrow{font-size:.82rem;font-weight:850;letter-spacing:.07em;color:#087f79;text-transform:uppercase}.muted{color:#587276}.bar{height:9px;background:#d6eae5;border-radius:10px;overflow:hidden;margin:8px 0 24px}.fill{height:100%;background:#087f79;transition:width .2s}.scene{font-size:1.06rem;line-height:1.65;margin:24px 0}.choices{display:grid;gap:12px;margin:22px 0}button{font:inherit;cursor:pointer;border-radius:14px;min-height:58px;padding:16px 18px;text-align:left;border:2px solid #cde6df;background:white;color:#18353a;line-height:1.45}button:focus-visible{outline:3px solid #c48d20;outline-offset:3px}button:hover{border-color:#087f79}.primary{background:#087f79;color:white;border-color:#087f79;text-align:center;font-weight:800;width:100%}.secondary{border-color:#087f79;color:#087f79;text-align:center;font-weight:700;width:100%}.feedback{background:#eff8f5;border-left:4px solid #087f79;padding:18px;border-radius:12px;margin:20px 0}.feedback strong{color:#076d66}.meta{font-size:.84rem;color:#607779;margin-top:26px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.stat{background:#eff8f5;border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:1.6rem;color:#087f79}.stat span{font-size:.78rem}.choice-label{display:block}.tip{padding:16px;background:#eff8f5;border-radius:12px;margin:20px 0}
</style></head><body><main><div class="brand">Human Literacy · Interactive Lesson 02</div><section id="app" class="panel" aria-live="polite"></section><p class="meta">Practice, not diagnosis or individualized professional advice. Your answers stay on this page; no account required.</p></main><script>
'use strict';const DATA={"scenarios": [{"title": "The unanswered message", "scene": "You sent a friend an important message yesterday. They have been active online but have not answered. You feel overlooked.", "question": "What is your most grounded next step?", "choices": [{"text": "“They may have seen it, so I will give them another day before deciding what it means.”", "rating": "Reasonable alternative", "why": "Waiting may help, but the fact that they were online does not establish why they have not replied.", "points": 1}, {"text": "“I feel overlooked, but I do not know why they have not replied. I can follow up directly if needed.”", "rating": "Strongest response", "why": "You recognize your emotion, separate it from an unverified motive, and keep a practical next step available.", "points": 2}, {"text": "“I know they are busy sometimes, but I should probably lower my expectations of this friendship.”", "rating": "Partly effective", "why": "Adjusting expectations can be healthy after a pattern, but one delay is too little information for a firm conclusion.", "points": 1}]}, {"title": "The look across the room", "scene": "At a family gathering, someone looks at you briefly and turns away. You remember a disagreement from last month and feel uneasy.", "question": "What is the most careful interpretation?", "choices": [{"text": "“The disagreement may still matter to them, so I will keep my distance tonight.”", "rating": "Partly effective", "why": "Giving space can be appropriate, but you are still making an unverified assumption about what the glance means.", "points": 1}, {"text": "“They might be uncomfortable, but I will ask another relative whether they are upset.”", "rating": "Partly effective", "why": "Seeking context can help, but asking third parties may invite speculation and gossip.", "points": 1}, {"text": "“I noticed the glance and felt uneasy. I cannot know their intention from that alone.”", "rating": "Strongest response", "why": "You acknowledge your reaction while avoiding mind-reading. If the relationship matters, you can speak directly later.", "points": 2}]}, {"title": "The missed deadline", "scene": "A coworker promised to send information by noon. It is now 3 PM, and you need it to finish a report.", "question": "How do you respond without inventing a motive?", "choices": [{"text": "“I was expecting the information by noon. What is the updated timing? I need it to finish the report.”", "rating": "Strongest response", "why": "You identify the observable delay, state the impact, and request the information needed to act.", "points": 2}, {"text": "“I know things come up, but it would help if you warned me earlier next time.”", "rating": "Reasonable alternative", "why": "This may improve future communication, but it does not directly address when you will receive the information now.", "points": 1}, {"text": "“I will finish the rest of the report and mention the delay if anyone asks.”", "rating": "Partly effective", "why": "Working on what you can control is sensible, but avoiding a direct follow-up may prolong the blockage.", "points": 1}]}], "quiz": [{"q": "Your friend has not replied. Which statement is a fact?", "choices": ["“My friend has been online but has not answered my message.”", "“My friend saw the message and decided I was unimportant.”", "“My friend is avoiding a difficult conversation.”"], "correct": 0, "why": "Activity and lack of reply may be observable. Their motive remains unknown."}, {"q": "A glance reminds you of a previous disagreement. What is the strongest interpretation?", "choices": ["“They are likely still angry, so I should protect myself.”", "“My unease is real, but the glance does not establish what they think.”", "“They must have moved on because they did not speak.”"], "correct": 1, "why": "A real feeling does not turn an uncertain interpretation into a fact."}, {"q": "A coworker misses a deadline. Which response is most effective?", "choices": ["“You seem overwhelmed, so I will wait until you are ready.”", "“I will tell my supervisor you are unreliable.”", "“The noon deadline passed. When can I expect the information I need?”"], "correct": 2, "why": "A factual, direct request addresses the problem without assuming the cause."}]};const app=document.getElementById('app');let stage='intro',idx=0,selected=null,practice=0,knowledge=0;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function btn(t,fn,cls='primary'){let b=document.createElement('button');b.className=cls;b.textContent=t;b.addEventListener('click',fn);return b}
function el(tag,txt,cls){let e=document.createElement(tag);if(cls)e.className=cls;e.textContent=txt;return e}
function appendText(tag,txt,cls){app.append(el(tag,txt,cls))}
function next(){idx++;selected=null;if(idx===3){idx=0;stage='quiz'}else stage='scenario';render()}
function reset(){stage='intro';idx=0;selected=null;practice=0;knowledge=0;render()}
function render(){app.replaceChildren();if(stage==='intro'){appendText('div','Lesson 02 · About 5 minutes','eyebrow');appendText('h1',"The Story We Tell Ourselves");appendText('p',"Separate observations from interpretations without dismissing your needs.");appendText('p','Choose a response in three everyday situations. Every option is plausible; the feedback explains the tradeoffs. Then complete a short knowledge check.');app.append(btn('Start lesson',()=>{stage='scenario';render()}));return}
if(stage==='scenario'){let s=DATA.scenarios[idx];appendText('div',`Situation ${idx+1} of 3`,'eyebrow');let bar=el('div','','bar'),fill=el('div','','fill');fill.style.width=`${idx/3*100}%`;bar.append(fill);app.append(bar);appendText('h2',s.title);appendText('p',s.scene,'scene');appendText('p',s.question);let choices=el('div','','choices');s.choices.forEach((c,j)=>choices.append(btn(c.text,()=>{selected=j;if(c.points===2)practice++;stage='feedback';render()},'choice')));app.append(choices);return}
if(stage==='feedback'){let s=DATA.scenarios[idx],c=s.choices[selected];appendText('div',`Situation ${idx+1} · Feedback`,'eyebrow');appendText('h2',c.rating);let fb=el('div','','feedback');fb.append(el('p',c.why));fb.append(el('p','A useful question: What does this choice protect, and what might it cost?'));app.append(fb);app.append(btn(idx===2?'Begin knowledge check':'Next situation',next));return}
if(stage==='quiz'){let q=DATA.quiz[idx];appendText('div',`Knowledge check ${idx+1} of 3`,'eyebrow');appendText('h2',q.q);let choices=el('div','','choices');q.choices.forEach((a,j)=>choices.append(btn(a,()=>{selected=j;if(j===q.correct)knowledge++;stage='answer';render()},'choice')));app.append(choices);return}
if(stage==='answer'){let q=DATA.quiz[idx];appendText('div',`Knowledge check ${idx+1} · Explanation`,'eyebrow');appendText('h2',selected===q.correct?'Strong answer':'Consider the distinction');appendText('p',q.why);let tip=el('div','','tip');tip.append(el('strong','Strongest answer:'));tip.append(el('p',q.choices[q.correct]));app.append(tip);app.append(btn(idx===2?'See learning summary':'Next question',()=>{idx++;selected=null;stage=idx===3?'result':'quiz';render()}));return}
appendText('div','Lesson complete','eyebrow');appendText('h1','You practiced thoughtful choices.');let stats=el('div','','stats');[[practice+'/3','Strongest scenario choices'],[knowledge+'/3','Knowledge check']].forEach(([n,t])=>{let box=el('div','','stat');box.append(el('b',n),el('span',t));stats.append(box)});app.append(stats);appendText('p','The point is not a perfect score. It is noticing the tradeoffs, practicing again, and carrying the skill into daily life.');app.append(btn('Practice again',reset),btn('Return to lesson library',()=>{location.href='../../'},'secondary'))}
render();</script></body></html>
