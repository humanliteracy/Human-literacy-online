<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f79"><title>Human Literacy Lab | Understanding Before Reacting</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#14252b;background:#edf5f3}*{box-sizing:border-box}body{margin:0}main{max-width:690px;margin:auto;padding:18px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;color:#087f79;letter-spacing:.04em;font-size:.86rem}.tag{font-size:.75rem;color:#51616b}.panel{background:white;border:1px solid #d4e5e0;border-radius:20px;padding:22px;margin-top:16px;box-shadow:0 6px 24px #133c3420}h1{font-size:clamp(1.55rem,5vw,2.2rem);line-height:1.18;margin:8px 0 12px}h2{font-size:1.3rem;line-height:1.3}p{line-height:1.6} .eyebrow{color:#087f79;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.muted{color:#53636c}.speech{background:#eff7f5;border-left:4px solid #087f79;border-radius:8px;padding:15px 16px;font-size:1.15rem;font-weight:650;line-height:1.5}.choices{display:grid;gap:11px;margin-top:16px}button{font:inherit;cursor:pointer;min-height:50px;border-radius:12px;padding:13px 16px;text-align:left}button:focus-visible{outline:3px solid #f5a524;outline-offset:3px}.choice{background:white;border:2px solid #c7dbd5;color:#14252b}.choice:hover:not(:disabled){border-color:#087f79;background:#f0faf7}.choice:disabled{cursor:default;opacity:.7}.choice.selected{border-color:#087f79;background:#e0f4ee;opacity:1}.primary{border:0;background:#087f79;color:white;font-weight:800;text-align:center;width:100%;margin-top:16px}.secondary{border:2px solid #087f79;background:white;color:#087f79;font-weight:750;text-align:center}.feedback{background:#f0f6fa;border-radius:14px;padding:16px;margin-top:17px;border:1px solid #d0e1e9}.feedback strong{display:block;margin-bottom:5px}.feedback p{margin:8px 0}.reaction{font-style:italic;color:#334e5a}.bar{height:9px;background:#d8e8e3;border-radius:10px;overflow:hidden;margin-top:14px}.fill{height:100%;background:#087f79;transition:width .25s}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:.85rem}.hidden{display:none!important}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#eff7f5;border-radius:12px;padding:12px 7px;text-align:center}.metric b{font-size:1.45rem;display:block}.metric span{font-size:.72rem;color:#53636c}.question-count{font-size:.86rem;color:#53636c}.check{margin:14px 0}.check label{display:flex;gap:10px;align-items:flex-start;line-height:1.4}.check input{width:20px;height:20px;flex:none;accent-color:#087f79}.footer{font-size:.78rem;color:#53636c;margin-top:20px}.status{color:#087f79;font-weight:750}ul{line-height:1.65;padding-left:22px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}@media(max-width:360px){.panel{padding:16px}.metrics{gap:5px}.metric span{font-size:.66rem}}
</style></head><body><main><header class="top"><div class="brand">HUMAN LITERACY LAB</div><div class="tag">Lesson 01 · Free · No sign-in</div></header><section class="panel" id="app" aria-live="polite"></section><footer class="footer">Educational simulation, not therapy or crisis guidance. Other people may react differently in real life. No answers are sent to a server; progress resets when this page is reloaded. Designed for touch, keyboard, and screen readers.</footer></main><script>
'use strict';
const scenarios=[
{title:'The misunderstanding',context:'A friend says you ignored their message. You were busy helping someone and feel unfairly accused.',line:'You never care enough to respond to me.',prompt:'What is the most constructive first response?',options:[{label:'Explain immediately how busy you were.',why:'Your explanation may be true, but it skips their concern. Starting with a defense can increase frustration.',reaction:'You always have an excuse.',points:0},{label:'Ask what felt hurtful and listen before explaining.',why:'You seek understanding without agreeing that you never care. Listening first can reduce unnecessary conflict.',reaction:'I was worried something had happened. A quick message would help.',points:2},{label:'Say they are overreacting and should calm down.',why:'Labeling the reaction dismisses their feelings and may escalate the conversation.',reaction:'That is exactly what I mean. You never listen.',points:0}],takeaway:'Listen to understand before trying to be understood.'},
{title:'The difficult boundary',context:'You regularly help a relative with errands. Today they ask you to cancel your own plans to do another nonurgent errand.',line:'If you really cared about me, you would drop everything.',prompt:'How can you show care while respecting yourself?',options:[{label:'Cancel your plans without discussing your limits.',why:'Helping can be kind, but automatic sacrifice can create resentment and unrealistic expectations.',reaction:'Thanks. I will call you next time too.',points:1},{label:'Say you care, cannot go today, and offer a time you can help.',why:'This communicates care and a clear limit while offering realistic support. You do not have to accept a guilt-based demand.',reaction:'I am disappointed, but tomorrow afternoon could work.',points:2},{label:'Tell them they are selfish and refuse further help.',why:'The limit may be necessary, but a personal attack can create avoidable harm.',reaction:'You do not need to insult me.',points:0}],takeaway:'A boundary is a clear statement of what you can do, not a punishment.'},
{title:'The alarming post',context:'A social media post claims that a familiar household product is dangerous. It gives no study or official source and urges immediate sharing.',line:'SHARE THIS NOW! They do not want you to know!',prompt:'What should you do before reacting or sharing?',options:[{label:'Share it to protect others, then verify later.',why:'A warning can spread quickly, including when it is false. Sharing before checking may cause harm.',reaction:'Several friends repost it without checking.',points:0},{label:'Dismiss the post because its tone is dramatic.',why:'An emotional tone is a warning sign, but it does not prove the claim false. Verify the underlying evidence.',reaction:'You still do not know whether the claim is true.',points:1},{label:'Look for the original evidence and credible independent confirmation.',why:'Checking the primary source, date, and independent reliable evidence helps separate a real risk from an unsupported claim.',reaction:'You find the original context and can make a better-informed decision.',points:2}],takeaway:'Pause, check the source, and distinguish a claim from evidence.'}
];
const quiz=[{q:'Someone sounds upset. What is the best first step when it is safe to talk?',options:['Prove your explanation is correct','Ask what they mean and listen','Agree with every accusation'],correct:1,why:'Listening first helps clarify the concern; it does not require agreement.'},{q:'Which response demonstrates a healthy boundary?',options:['I care, but I cannot do that today. I can help tomorrow.','I will always do whatever you need.','You are selfish for asking.'],correct:0,why:'A healthy boundary combines a realistic limit with respectful communication.'},{q:'An urgent online claim has no source. What should you do?',options:['Forward it immediately','Assume it is false without checking','Find original evidence and independent confirmation'],correct:2,why:'Verification is more reliable than either immediate belief or immediate dismissal.'}];
let stage='intro',index=0,selected=null,history=[],qindex=0,qselected=null,qhistory=[];const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function btn(label,fn,cls='primary'){const b=document.createElement('button');b.className=cls;b.textContent=label;b.addEventListener('click',fn);return b;}
function render(){app.innerHTML='';if(stage==='intro'){app.innerHTML='<div class="eyebrow">Interactive learning experience</div><h1>Understanding Before Reacting</h1><p>Practice three real-life skills: <strong>listening, setting boundaries, and checking evidence.</strong></p><p>You will choose how to respond, see an example consequence, and receive immediate feedback. Then take a short assessment.</p><div class="speech">The goal is not to win every conversation. It is to make your next response more thoughtful.</div><p class="muted small">About 5 minutes · No sound required · No account · Replay anytime</p>';app.append(btn('Start the lesson',()=>{stage='scenario';render()}));return;}
if(stage==='scenario'){const s=scenarios[index];app.innerHTML=`<div class="row"><div class="eyebrow">Scenario ${index+1} of 3</div><div class="question-count">${Math.round((index/3)*100)}% through practice</div></div><div class="bar" role="progressbar" aria-label="Practice progress" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${index}"><div class="fill" style="width:${index/3*100}%"></div></div><h1>${esc(s.title)}</h1><p>${esc(s.context)}</p><div class="speech">“${esc(s.line)}”</div><h2>${esc(s.prompt)}</h2><div class="choices" id="choices"></div><div id="out"></div>`;const c=document.getElementById('choices');s.options.forEach((o,j)=>{const b=btn(`${String.fromCharCode(65+j)}. ${o.label}`,()=>choose(j),'choice');b.disabled=selected!==null;if(selected===j)b.classList.add('selected');c.append(b)});if(selected!==null)showFeedback();return;}
if(stage==='quiz'){const q=quiz[qindex];app.innerHTML=`<div class="eyebrow">Learning assessment</div><div class="row"><h1>Question ${qindex+1} of 3</h1><span class="question-count">Choose one</span></div><div class="bar"><div class="fill" style="width:${qindex/3*100}%"></div></div><h2>${esc(q.q)}</h2><div class="choices" id="choices"></div><div id="out"></div>`;q.options.forEach((o,j)=>{const b=btn(`${String.fromCharCode(65+j)}. ${o}`,()=>chooseQuiz(j),'choice');b.disabled=qselected!==null;if(qselected===j)b.classList.add('selected');document.getElementById('choices').append(b)});if(qselected!==null)showQuizFeedback();return;}
if(stage==='result'){const practice=history.reduce((n,h,i)=>n+scenarios[i].options[h].points,0),score=qhistory.filter((x,i)=>x===quiz[i].correct).length;app.innerHTML=`<div class="eyebrow">Lesson complete</div><h1>Your learning summary</h1><div class="metrics"><div class="metric"><b>${history.length}/3</b><span>Scenarios completed</span></div><div class="metric"><b>${practice}/6</b><span>Practice points</span></div><div class="metric"><b>${score}/3</b><span>Knowledge check</span></div></div><h2>${score===3?'You understood the key ideas.':'You have a useful starting point.'}</h2><p>${score===3?'You identified listening, boundaries, and evidence-checking across all three questions.':'Review the ideas below and try again. Repetition helps turn knowledge into practical judgment.'}</p><ul><li><strong>Listen:</strong> understand the concern before defending your position.</li><li><strong>Boundaries:</strong> care for others without promising more than you can give.</li><li><strong>Evidence:</strong> verify claims before believing or sharing them.</li></ul><p class="muted small">Practice points reflect the lesson design, not a psychological assessment. The knowledge check measures immediate recall, not long-term behavior change.</p>`;app.append(btn('Replay the entire lesson',reset));app.append(btn('Retake only the assessment',()=>{qindex=0;qselected=null;qhistory=[];stage='quiz';render()},'secondary'));return;}}
function choose(j){if(selected!==null)return;selected=j;history.push(j);render();document.getElementById('out').scrollIntoView({block:'nearest',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function showFeedback(){const s=scenarios[index],o=s.options[selected],out=document.getElementById('out');out.innerHTML=`<div class="feedback" role="status"><strong>Immediate feedback · ${o.points===2?'Strong choice':o.points===1?'Partly effective':'Consider another approach'}</strong><p>${esc(o.why)}</p><strong>Possible response</strong><p class="reaction">“${esc(o.reaction)}”</p><strong>Remember</strong><p>${esc(s.takeaway)}</p></div>`;out.append(btn(index===2?'Begin the learning assessment':'Continue to next scenario',()=>{index++;selected=null;if(index===3)stage='quiz';render();window.scrollTo({top:0,behavior:'instant'})}));out.append(btn('Try a different response',()=>{history.pop();selected=null;render()},'secondary'));}
function chooseQuiz(j){if(qselected!==null)return;qselected=j;qhistory.push(j);render();}
function showQuizFeedback(){const q=quiz[qindex],ok=qselected===q.correct,out=document.getElementById('out');out.innerHTML=`<div class="feedback" role="status"><strong>${ok?'That is right.':'Not quite.'}</strong><p>${esc(q.why)}</p>${ok?'':`<p>The best answer is: ${esc(q.options[q.correct])}</p>`}</div>`;out.append(btn(qindex===2?'See my learning summary':'Next question',()=>{qindex++;qselected=null;if(qindex===3)stage='result';render();window.scrollTo({top:0,behavior:'instant'})}));}
function reset(){stage='intro';index=0;selected=null;history=[];qindex=0;qselected=null;qhistory=[];render();window.scrollTo({top:0,behavior:'instant'})}render();
</script></body></html>
