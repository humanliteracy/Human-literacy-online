const DATA={"scenarios": [{"title": "The sharp reply", "scene": "Someone at home answers your simple question in a sharp tone. You feel hurt and angry, but you do not know what caused their tone.", "question": "What is the most thoughtful first response?", "choices": [{"text": "“That sounded sharp. I am feeling hurt, and I want to understand what is going on.”", "rating": "Strongest response", "why": "You name the impact without claiming to know their intention, opening the door to clarification.", "points": 2, "feedback": "You name the impact without claiming to know their intention, opening the door to clarification.", "best": true}, {"text": "“You seem stressed. I will give you some space and we can talk later.”", "rating": "Reasonable alternative", "why": "Space may help, but saying they seem stressed is still an interpretation. Check whether postponing is actually helpful.", "points": 1, "feedback": "Space may help, but saying they seem stressed is still an interpretation. Check whether postponing is actually helpful. Another approach: “That sounded sharp. I am feeling hurt, and I want to understand what is going on.” You name the impact without claiming to know their intention, opening the door to clarification.", "best": false}, {"text": "“I did not like that tone. Please speak to me more gently.”", "rating": "Reasonable alternative", "why": "You can ask for respectful communication, but a brief check-in may help explain an isolated tense moment.", "points": 1, "feedback": "You can ask for respectful communication, but a brief check-in may help explain an isolated tense moment. Another approach: “That sounded sharp. I am feeling hurt, and I want to understand what is going on.” You name the impact without claiming to know their intention, opening the door to clarification.", "best": false}]}, {"title": "The changed plan", "scene": "A friend cancels dinner at the last minute. You were looking forward to it and feel disappointed. They offer no explanation.", "question": "Which response balances honesty and curiosity?", "choices": [{"text": "“I understand plans change. Let us choose another date when you are free.”", "rating": "Partly effective", "why": "You are flexible, but you leave your disappointment and the last-minute impact unspoken.", "points": 1, "feedback": "You are flexible, but you leave your disappointment and the last-minute impact unspoken. Another approach: “I was disappointed because I had planned around tonight. Is everything okay?” You express your experience clearly while allowing room for information you do not have.", "best": false}, {"text": "“I was disappointed because I had planned around tonight. Is everything okay?”", "rating": "Strongest response", "why": "You express your experience clearly while allowing room for information you do not have.", "points": 2, "feedback": "You express your experience clearly while allowing room for information you do not have.", "best": true}, {"text": "“I would appreciate more notice next time. I will reach out when I am ready to reschedule.”", "rating": "Reasonable alternative", "why": "This is a valid boundary, especially if cancellations repeat, though it may be worth checking what happened first.", "points": 1, "feedback": "This is a valid boundary, especially if cancellations repeat, though it may be worth checking what happened first. Another approach: “I was disappointed because I had planned around tonight. Is everything okay?” You express your experience clearly while allowing room for information you do not have.", "best": false}]}, {"title": "The crowded afternoon", "scene": "Three people ask for help at once. You feel overwhelmed and impatient. Two requests are routine; one may be time-sensitive.", "question": "What is the strongest next move?", "choices": [{"text": "“I will handle the fastest tasks first so everyone sees some progress.”", "rating": "Partly effective", "why": "Quick wins may feel useful, but urgency and your capacity matter more than speed alone.", "points": 1, "feedback": "Quick wins may feel useful, but urgency and your capacity matter more than speed alone. Another approach: “I am overloaded. I will check what is urgent, then say what I can realistically handle.” You recognize your limits, assess priorities, and make commitments you can sustain.", "best": false}, {"text": "“I need a few minutes before I can answer anyone. Please wait.”", "rating": "Reasonable alternative", "why": "A pause can help you regulate, but you still need to identify whether any request is urgent.", "points": 1, "feedback": "A pause can help you regulate, but you still need to identify whether any request is urgent. Another approach: “I am overloaded. I will check what is urgent, then say what I can realistically handle.” You recognize your limits, assess priorities, and make commitments you can sustain.", "best": false}, {"text": "“I am overloaded. I will check what is urgent, then say what I can realistically handle.”", "rating": "Strongest response", "why": "You recognize your limits, assess priorities, and make commitments you can sustain.", "points": 2, "feedback": "You recognize your limits, assess priorities, and make commitments you can sustain.", "best": true}]}], "quiz": [{"q": "You feel hurt by someone’s tone. Which is the most careful response?", "choices": ["“I know they intended to be rude, but I can forgive them.”", "“I should ignore the feeling until it disappears.”", "“I felt hurt; I can describe the impact and ask what happened.”"], "correct": 2, "why": "The feeling is real, while the other person’s intention may still need clarification. Strongest answer: “I felt hurt; I can describe the impact and ask what happened.”"}, {"q": "A friend cancels unexpectedly. Which statement balances honesty and openness?", "choices": ["“I was disappointed. Is everything okay, and can we discuss rescheduling?”", "“I will stop expecting them to keep plans.”", "“I will say nothing because they may have a good reason.”"], "correct": 0, "why": "You can express your experience and remain curious about theirs. Strongest answer: “I was disappointed. Is everything okay, and can we discuss rescheduling?”"}, {"q": "Several people need your help. What should guide your next action?", "choices": ["“Agree to the requests in the order they arrived.”", "“Pause, identify urgency, and explain what you can realistically do.”", "“Finish the easiest requests before telling anyone you are overwhelmed.”"], "correct": 1, "why": "A pause plus prioritization and clear limits helps prevent avoidable harm. Strongest answer: “Pause, identify urgency, and explain what you can realistically do.”"}]};
const app=document.getElementById('app');let stage='scenarios',index=0,selected=null,score=0,quizScore=0;
function add(tag,cls,content,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;(parent||app).append(e);return e}
function panel(){return add('section','panel',undefined,app)}
function button(label,action,cls,parent){const b=add('button',cls||'button',label,parent);b.type='button';b.addEventListener('click',action);return b}
function progress(current,total,parent){const p=add('div','progress',undefined,parent);p.setAttribute('role','progressbar');p.setAttribute('aria-valuenow',current);p.setAttribute('aria-valuemin',0);p.setAttribute('aria-valuemax',total);p.setAttribute('aria-label','Lesson progress');const bar=add('div','',undefined,p);bar.style.width=(100*current/total)+'%'}
function next(){selected=null;index++;if(stage==='scenarios'&&index>=DATA.scenarios.length){stage='quiz';index=0}else if(stage==='quiz'&&index>=DATA.quiz.length){stage='done';index=0}render();window.scrollTo(0,0)}
function reset(){stage='scenarios';index=0;selected=null;score=0;quizScore=0;render();window.scrollTo(0,0)}
function render(){app.replaceChildren();if(stage==='scenarios'){
 const s=DATA.scenarios[index],c=panel();add('div','eyebrow',`Situation ${index+1} of ${DATA.scenarios.length}`,c);progress(index,DATA.scenarios.length,c);add('h1','',s.title,c);add('p','',s.scene,c);add('p','question',s.question,c);
 s.choices.forEach((o,i)=>{const b=button(o.text,()=>{if(selected!==null)return;selected=i;if(o.best)score++;render()},'choice'+(selected===i?' selected':''),c);b.disabled=selected!==null});
 if(selected!==null){const o=s.choices[selected],f=add('div','feedback',undefined,c);add('strong','',o.best?'Why this works':'Consider the tradeoff',f);add('div','',o.feedback,f);button(index===DATA.scenarios.length-1?'Continue to knowledge check':'Next',next,'button',c)}return}
 if(stage==='quiz'){const q=DATA.quiz[index],c=panel();add('div','eyebrow',`Knowledge check ${index+1} of ${DATA.quiz.length}`,c);progress(index,DATA.quiz.length,c);add('h1','','Check your understanding',c);add('p','question',q.q,c);
 q.choices.forEach((o,i)=>{const b=button(o,()=>{if(selected!==null)return;selected=i;if(i===q.correct)quizScore++;render()},'choice'+(selected===i?' selected':''),c);b.disabled=selected!==null});
 if(selected!==null){const f=add('div','feedback',undefined,c);add('strong','',selected===q.correct?'Why this works':'Consider the tradeoff',f);add('div','',q.why,f);button(index===DATA.quiz.length-1?'See my results':'Next',next,'button',c)}return}
 const c=panel();add('div','eyebrow','Lesson complete',c);add('h1','','Recognizing and Managing Emotional Reactions',c);add('p','',`Practice: ${score} of ${DATA.scenarios.length} strongest choices. Knowledge check: ${quizScore} of ${DATA.quiz.length} correct.`,c);add('p','', 'What matters is recognizing the tradeoffs, not getting every answer right the first time. Practice noticing, understanding, and responding thoughtfully in daily life.',c);button('Practice again',reset,'button',c);const a=add('a','','Back to all lessons',c);a.href='../../';a.style.display='block';a.style.marginTop='18px'
}render();</script></body></html>
