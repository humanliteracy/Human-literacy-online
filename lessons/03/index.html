<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf8f5"><title>Lesson 03 — Understanding Emotions Before Acting | Human Literacy</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#18353a;background:#eaf8f5;font-size:18px}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:22px 17px 55px}.brand{font-size:.8rem;font-weight:850;color:#087f79;letter-spacing:.11em;text-transform:uppercase;margin-bottom:20px}.panel{background:white;border:1px solid #cce6e0;border-radius:24px;padding:clamp(23px,5vw,38px);box-shadow:0 12px 28px #124d4020}h1{font-size:clamp(1.8rem,6vw,2.5rem);line-height:1.17}h2{font-size:clamp(1.45rem,5vw,2rem);line-height:1.22}p{line-height:1.65}.eyebrow{font-size:.82rem;font-weight:850;letter-spacing:.07em;color:#087f79;text-transform:uppercase}.muted{color:#587276}.bar{height:9px;background:#d6eae5;border-radius:10px;overflow:hidden;margin:8px 0 24px}.fill{height:100%;background:#087f79;transition:width .2s}.scene{font-size:1.06rem;line-height:1.65;margin:24px 0}.choices{display:grid;gap:12px;margin:22px 0}button{font:inherit;cursor:pointer;border-radius:14px;min-height:58px;padding:16px 18px;text-align:left;border:2px solid #cde6df;background:white;color:#18353a;line-height:1.45}button:focus-visible{outline:3px solid #c48d20;outline-offset:3px}button:hover{border-color:#087f79}.primary{background:#087f79;color:white;border-color:#087f79;text-align:center;font-weight:800;width:100%}.secondary{border-color:#087f79;color:#087f79;text-align:center;font-weight:700;width:100%}.feedback{background:#eff8f5;border-left:4px solid #087f79;padding:18px;border-radius:12px;margin:20px 0}.feedback strong{color:#076d66}.meta{font-size:.84rem;color:#607779;margin-top:26px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.stat{background:#eff8f5;border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:1.6rem;color:#087f79}.stat span{font-size:.78rem}.choice-label{display:block}.tip{padding:16px;background:#eff8f5;border-radius:12px;margin:20px 0}
</style></head><body><main><div class="brand">Human Literacy · Interactive Lesson 03</div><section id="app" class="panel" aria-live="polite"></section><p class="meta">Practice, not diagnosis or individualized professional advice. Your answers stay on this page; no account required.</p></main><script>
'use strict';const DATA={"scenarios": [{"title": "The sharp reply", "scene": "Someone at home answers your simple question in a sharp tone. You feel hurt and angry, but you do not know what caused their tone.", "question": "What is the most thoughtful first response?", "choices": [{"text": "“That sounded sharp. I am feeling hurt, and I want to understand what is going on.”", "rating": "Strongest response", "why": "You name the impact without claiming to know their intention, opening the door to clarification.", "points": 2}, {"text": "“You seem stressed. I will give you some space and we can talk later.”", "rating": "Reasonable alternative", "why": "Space may help, but saying they seem stressed is still an interpretation. Check whether postponing is actually helpful.", "points": 1}, {"text": "“I did not like that tone. Please speak to me more gently.”", "rating": "Reasonable alternative", "why": "You can ask for respectful communication, but a brief check-in may help explain an isolated tense moment.", "points": 1}]}, {"title": "The changed plan", "scene": "A friend cancels dinner at the last minute. You were looking forward to it and feel disappointed. They offer no explanation.", "question": "Which response balances honesty and curiosity?", "choices": [{"text": "“I understand plans change. Let us choose another date when you are free.”", "rating": "Partly effective", "why": "You are flexible, but you leave your disappointment and the last-minute impact unspoken.", "points": 1}, {"text": "“I was disappointed because I had planned around tonight. Is everything okay?”", "rating": "Strongest response", "why": "You express your experience clearly while allowing room for information you do not have.", "points": 2}, {"text": "“I would appreciate more notice next time. I will reach out when I am ready to reschedule.”", "rating": "Reasonable alternative", "why": "This is a valid boundary, especially if cancellations repeat, though it may be worth checking what happened first.", "points": 1}]}, {"title": "The crowded afternoon", "scene": "Three people ask for help at once. You feel overwhelmed and impatient. Two requests are routine; one may be time-sensitive.", "question": "What is the strongest next move?", "choices": [{"text": "“I will handle the fastest tasks first so everyone sees some progress.”", "rating": "Partly effective", "why": "Quick wins may feel useful, but urgency and your capacity matter more than speed alone.", "points": 1}, {"text": "“I need a few minutes before I can answer anyone. Please wait.”", "rating": "Reasonable alternative", "why": "A pause can help you regulate, but you still need to identify whether any request is urgent.", "points": 1}, {"text": "“I am overloaded. I will check what is urgent, then say what I can realistically handle.”", "rating": "Strongest response", "why": "You recognize your limits, assess priorities, and make commitments you can sustain.", "points": 2}]}], "quiz": [{"q": "You feel hurt by someone’s tone. Which is the most careful response?", "choices": ["“I know they intended to be rude, but I can forgive them.”", "“I should ignore the feeling until it disappears.”", "“I felt hurt; I can describe the impact and ask what happened.”"], "correct": 2, "why": "The feeling is real, while the other person’s intention may still need clarification."}, {"q": "A friend cancels unexpectedly. Which statement balances honesty and openness?", "choices": ["“I was disappointed. Is everything okay, and can we discuss rescheduling?”", "“I will stop expecting them to keep plans.”", "“I will say nothing because they may have a good reason.”"], "correct": 0, "why": "You can express your experience and remain curious about theirs."}, {"q": "Several people need your help. What should guide your next action?", "choices": ["“Agree to the requests in the order they arrived.”", "“Pause, identify urgency, and explain what you can realistically do.”", "“Finish the easiest requests before telling anyone you are overwhelmed.”"], "correct": 1, "why": "A pause plus prioritization and clear limits helps prevent avoidable harm."}]};const app=document.getElementById('app');let stage='intro',idx=0,selected=null,practice=0,knowledge=0;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function btn(t,fn,cls='primary'){let b=document.createElement('button');b.className=cls;b.textContent=t;b.addEventListener('click',fn);return b}
function el(tag,txt,cls){let e=document.createElement(tag);if(cls)e.className=cls;e.textContent=txt;return e}
function appendText(tag,txt,cls){app.append(el(tag,txt,cls))}
function next(){idx++;selected=null;if(idx===3){idx=0;stage='quiz'}else stage='scenario';render()}
function reset(){stage='intro';idx=0;selected=null;practice=0;knowledge=0;render()}
function render(){app.replaceChildren();if(stage==='intro'){appendText('div','Lesson 03 · About 5 minutes','eyebrow');appendText('h1',"Understanding Emotions Before Acting");appendText('p',"Notice the feeling, check your interpretation, and choose a useful action.");appendText('p','Choose a response in three everyday situations. Every option is plausible; the feedback explains the tradeoffs. Then complete a short knowledge check.');app.append(btn('Start lesson',()=>{stage='scenario';render()}));return}
if(stage==='scenario'){let s=DATA.scenarios[idx];appendText('div',`Situation ${idx+1} of 3`,'eyebrow');let bar=el('div','','bar'),fill=el('div','','fill');fill.style.width=`${idx/3*100}%`;bar.append(fill);app.append(bar);appendText('h2',s.title);appendText('p',s.scene,'scene');appendText('p',s.question);let choices=el('div','','choices');s.choices.forEach((c,j)=>choices.append(btn(c.text,()=>{selected=j;if(c.points===2)practice++;stage='feedback';render()},'choice')));app.append(choices);return}
if(stage==='feedback'){let s=DATA.scenarios[idx],c=s.choices[selected];appendText('div',`Situation ${idx+1} · Feedback`,'eyebrow');appendText('h2',c.rating);let fb=el('div','','feedback');fb.append(el('p',c.why));fb.append(el('p','A useful question: What does this choice protect, and what might it cost?'));app.append(fb);app.append(btn(idx===2?'Begin knowledge check':'Next situation',next));return}
if(stage==='quiz'){let q=DATA.quiz[idx];appendText('div',`Knowledge check ${idx+1} of 3`,'eyebrow');appendText('h2',q.q);let choices=el('div','','choices');q.choices.forEach((a,j)=>choices.append(btn(a,()=>{selected=j;if(j===q.correct)knowledge++;stage='answer';render()},'choice')));app.append(choices);return}
if(stage==='answer'){let q=DATA.quiz[idx];appendText('div',`Knowledge check ${idx+1} · Explanation`,'eyebrow');appendText('h2',selected===q.correct?'Strong answer':'Consider the distinction');appendText('p',q.why);let tip=el('div','','tip');tip.append(el('strong','Strongest answer:'));tip.append(el('p',q.choices[q.correct]));app.append(tip);app.append(btn(idx===2?'See learning summary':'Next question',()=>{idx++;selected=null;if(idx===3)stage='result';render()}));return}
appendText('div','Lesson complete','eyebrow');appendText('h1','You practiced thoughtful choices.');let stats=el('div','','stats');[[practice+'/3','Strongest scenario choices'],[knowledge+'/3','Knowledge check']].forEach(([n,t])=>{let box=el('div','','stat');box.append(el('b',n),el('span',t));stats.append(box)});app.append(stats);appendText('p','The point is not a perfect score. It is noticing the tradeoffs, practicing again, and carrying the skill into daily life.');app.append(btn('Practice again',reset),btn('Return to lesson library',()=>{location.href='../../'},'secondary'))}
render();</script></body></html>
