<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eaf8f5"><title>Lesson 04 — Understanding Boundaries | Human Literacy</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#173439;background:#eaf8f5}*{box-sizing:border-box}body{margin:0}main{max-width:740px;margin:auto;padding:22px 17px 55px}.brand{font-size:.78rem;letter-spacing:.15em;font-weight:850;color:#087f76}.panel{background:white;border:1px solid #cce7e0;border-radius:24px;padding:25px 22px;margin:18px 0;box-shadow:0 9px 28px #125e5010}h1{font-size:clamp(2rem,7vw,3.3rem);line-height:1.12;margin:15px 0}h2{font-size:1.5rem;line-height:1.25}p{line-height:1.6;font-size:1.08rem}.muted{color:#567077}.eyebrow{color:#087f76;font-weight:850;font-size:.83rem;letter-spacing:.08em;text-transform:uppercase}.button{display:block;width:100%;border:0;border-radius:15px;background:#087f76;color:#fff;font-size:1.08rem;font-weight:800;padding:17px;margin:12px 0;cursor:pointer;text-align:left}.button:focus-visible,.choice:focus-visible,a:focus-visible{outline:3px solid #e2a849;outline-offset:3px}.button.secondary{background:#e5f5f1;color:#075f59;text-align:center}.choice{display:block;width:100%;border:2px solid #cce7e0;background:#fff;border-radius:15px;text-align:left;padding:17px;margin:12px 0;font:inherit;color:#173439;cursor:pointer;line-height:1.4}.choice:hover{border-color:#087f76}.choice:disabled{cursor:default;opacity:.8}.choice.selected{border-color:#087f76;background:#e7f7f3;opacity:1}.feedback{border-left:5px solid #087f76;background:#eff9f6;border-radius:10px;padding:15px;margin-top:17px}.feedback strong{display:block;margin-bottom:6px}.progress{height:9px;background:#d7eae5;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#087f76;transition:width .2s}a{color:#076c65}small{line-height:1.5}footer{color:#617c7c;font-size:.9rem;padding:18px 3px}ul{line-height:1.65;padding-left:22px}
</style>

<body><main><div class="brand">HUMAN LITERACY · INTERACTIVE LESSON</div><div id="app" aria-live="polite"></div><footer>Practice, not a diagnosis or individualized professional advice. Your choices stay on this page; no account required.</footer></main>
<script>
'use strict';
const scenarios=[
{title:'The last-minute favor',scene:'You have had a demanding day. A friend asks you to drive across town tonight. You care about them, but you need rest.',question:'What response respects both people?',options:[{text:'Say yes even though you are exhausted.',feedback:'Helping at your own expense every time can create resentment and exhaustion. Your needs matter too.',best:false},{text:'“I care about you, but I cannot drive tonight. Can we look at another option?”',feedback:'You state your limit clearly, show care, and leave room to problem-solve without promising what you cannot give.',best:true},{text:'Ignore the message so you do not have to say no.',feedback:'Avoiding the conversation may protect you briefly, but a clear response is usually kinder and less confusing.',best:false}]},
{title:'The private conversation',scene:'A family member asks about something personal. You are not comfortable discussing it, and they keep asking.',question:'What is a respectful boundary?',options:[{text:'“I’m not ready to talk about that. Please don’t ask me again today.”',feedback:'You can be direct without being harsh. You are allowed to choose what personal information you share.',best:true},{text:'Explain every private detail until they are satisfied.',feedback:'You do not owe unlimited explanations to earn respect for your privacy.',best:false},{text:'Insult them for asking.',feedback:'Anger is understandable, but insults can distract from the limit you want respected.',best:false}]},
{title:'When someone says no',scene:'You invite someone to an activity. They decline without giving a reason. You feel disappointed.',question:'How can you respect their boundary?',options:[{text:'Keep pressing until they explain themselves.',feedback:'Repeated pressure can turn an invitation into an obligation. A no does not always require an explanation.',best:false},{text:'Tell them they must not care about you.',feedback:'Their decision may have nothing to do with how much they care. Avoid turning an assumption into a fact.',best:false},{text:'“Okay, thanks for letting me know. Maybe another time.”',feedback:'You acknowledge their choice without punishing them for it. You can feel disappointed and still respect their decision.',best:true}]}
];
const quiz=[
{q:'A healthy boundary is best described as…',options:['A rule that forces everyone to do what I want','A clear statement about what I will or will not do','A way to avoid every uncomfortable conversation'],answer:1,why:'Boundaries describe your limits and actions; they do not control another person.'},
{q:'If someone dislikes your reasonable boundary, that means…',options:['The boundary is automatically wrong','You must give in','Their feelings matter, but you can still maintain your limit'],answer:2,why:'You can care about someone’s feelings without abandoning your own needs.'},
{q:'What is a respectful response when another person says no?',options:['Accept the answer without demanding justification','Ask repeatedly until they agree','Assume they dislike you'],answer:0,why:'Respecting boundaries works in both directions.'}
];
const app=document.getElementById('app');let stage='intro',index=0,selected=null,score=0,quizScore=0;function el(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}function add(tag,cls,content,parent=app){const e=el(tag,cls,content);parent.append(e);return e}function button(label,fn,cls='button',parent=app){const b=add('button',cls,label,parent);b.type='button';b.addEventListener('click',fn);return b}function panel(){return add('section','panel')}function reset(){stage='intro';index=0;selected=null;score=0;quizScore=0;render()}function next(){selected=null;index++;if(stage==='scenarios'&&index>=scenarios.length){stage='quiz-intro';index=0}else if(stage==='quiz'&&index>=quiz.length){stage='done';index=0}render()}function progress(current,total,parent){const p=add('div','progress',undefined,parent);p.setAttribute('role','progressbar');p.setAttribute('aria-valuenow',current);p.setAttribute('aria-valuemin',0);p.setAttribute('aria-valuemax',total);p.setAttribute('aria-label','Lesson progress');const bar=add('div','',undefined,p);bar.style.width=(100*current/total)+'%'}function render(){app.replaceChildren();if(stage==='intro'){const c=panel();add('div','eyebrow','Lesson 04 · About 5 minutes',c);add('h1','', 'Understanding Boundaries',c);add('p','', 'Learn to respect your own limits and the limits of others through everyday situations.',c);add('p','muted','A boundary is not a punishment. It is a clear way to communicate what you can do, what you need, and what you will choose.',c);add('h2','','You will practice',c);const u=add('ul','',undefined,c);['Saying no without being unkind','Protecting your privacy','Respecting someone else’s no'].forEach(x=>add('li','',x,u));button('Start Lesson 04',()=>{stage='scenarios';render()},'button',c);return}if(stage==='scenarios'){const s=scenarios[index],c=panel();add('div','eyebrow',`Situation ${index+1} of ${scenarios.length}`,c);progress(index,scenarios.length,c);add('h2','',s.title,c);add('p','',s.scene,c);add('p','',s.question,c);s.options.forEach((o,i)=>{const b=button(o.text,()=>{if(selected!==null)return;selected=i;if(o.best)score++;render()},'choice'+(selected===i?' selected':''),c);b.disabled=selected!==null});if(selected!==null){const f=add('div','feedback',undefined,c);add('strong','',s.options[selected].best?'Strong choice':'A useful moment to reflect',f);add('div','',s.options[selected].feedback,f);button(index===scenarios.length-1?'Continue to knowledge check':'Next situation',next,'button',c)}return}if(stage==='quiz-intro'){const c=panel();add('div','eyebrow','Reflection',c);add('h2','','Three quick questions',c);add('p','',`You practiced ${scenarios.length} situations and chose ${score} of ${scenarios.length} strongest responses. There is no penalty for learning.`,c);add('p','', 'Now check what you remember.',c);button('Start knowledge check',()=>{stage='quiz';index=0;render()},'button',c);return}if(stage==='quiz'){const q=quiz[index],c=panel();add('div','eyebrow',`Question ${index+1} of ${quiz.length}`,c);progress(index,quiz.length,c);add('h2','',q.q,c);q.options.forEach((t,i)=>{const b=button(t,()=>{if(selected!==null)return;selected=i;if(i===q.answer)quizScore++;render()},'choice'+(selected===i?' selected':''),c);b.disabled=selected!==null});if(selected!==null){const f=add('div','feedback',undefined,c);add('strong','',selected===q.answer?'Correct':'Here is the key idea',f);add('div','',q.why,f);button(index===quiz.length-1?'See my results':'Next question',next,'button',c)}return}const c=panel();add('div','eyebrow','Lesson complete',c);add('h1','','Your limits matter. So do theirs.',c);add('p','',`Practice choices: ${score} / 3 strongest responses. Knowledge check: ${quizScore} / 3 correct.`,c);add('p','', 'One idea to carry forward: “I can care about you and still say no.”',c);add('p','muted','Real life is more complicated than a quiz. The goal is not perfect answers; it is noticing your limits and communicating them with respect.',c);button('Practice again',reset,'button',c);const a=add('a','', 'Back to all lessons',c);a.href='../../';a.style.display='block';a.style.marginTop='18px'}render();
</script></body></html>
