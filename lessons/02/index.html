const DATA={"scenarios": [{"title": "The unanswered message", "scene": "You sent a friend an important message yesterday. They have been active online but have not answered. You feel overlooked.", "question": "What is your most grounded next step?", "choices": [{"text": "“They may have seen it, so I will give them another day before deciding what it means.”", "rating": "Reasonable alternative", "why": "Waiting may help, but the fact that they were online does not establish why they have not replied.", "points": 1, "feedback": "Waiting may help, but the fact that they were online does not establish why they have not replied. Another approach: “I feel overlooked, but I do not know why they have not replied. I can follow up directly if needed.” You recognize your emotion, separate it from an unverified motive, and keep a practical next step available.", "best": false}, {"text": "“I feel overlooked, but I do not know why they have not replied. I can follow up directly if needed.”", "rating": "Strongest response", "why": "You recognize your emotion, separate it from an unverified motive, and keep a practical next step available.", "points": 2, "feedback": "You recognize your emotion, separate it from an unverified motive, and keep a practical next step available.", "best": true}, {"text": "“I know they are busy sometimes, but I should probably lower my expectations of this friendship.”", "rating": "Partly effective", "why": "Adjusting expectations can be healthy after a pattern, but one delay is too little information for a firm conclusion.", "points": 1, "feedback": "Adjusting expectations can be healthy after a pattern, but one delay is too little information for a firm conclusion. Another approach: “I feel overlooked, but I do not know why they have not replied. I can follow up directly if needed.” You recognize your emotion, separate it from an unverified motive, and keep a practical next step available.", "best": false}]}, {"title": "The look across the room", "scene": "At a family gathering, someone looks at you briefly and turns away. You remember a disagreement from last month and feel uneasy.", "question": "What is the most careful interpretation?", "choices": [{"text": "“The disagreement may still matter to them, so I will keep my distance tonight.”", "rating": "Partly effective", "why": "Giving space can be appropriate, but you are still making an unverified assumption about what the glance means.", "points": 1, "feedback": "Giving space can be appropriate, but you are still making an unverified assumption about what the glance means. Another approach: “I noticed the glance and felt uneasy. I cannot know their intention from that alone.” You acknowledge your reaction while avoiding mind-reading. If the relationship matters, you can speak directly later.", "best": false}, {"text": "“They might be uncomfortable, but I will ask another relative whether they are upset.”", "rating": "Partly effective", "why": "Seeking context can help, but asking third parties may invite speculation and gossip.", "points": 1, "feedback": "Seeking context can help, but asking third parties may invite speculation and gossip. Another approach: “I noticed the glance and felt uneasy. I cannot know their intention from that alone.” You acknowledge your reaction while avoiding mind-reading. If the relationship matters, you can speak directly later.", "best": false}, {"text": "“I noticed the glance and felt uneasy. I cannot know their intention from that alone.”", "rating": "Strongest response", "why": "You acknowledge your reaction while avoiding mind-reading. If the relationship matters, you can speak directly later.", "points": 2, "feedback": "You acknowledge your reaction while avoiding mind-reading. If the relationship matters, you can speak directly later.", "best": true}]}, {"title": "The missed deadline", "scene": "A coworker promised to send information by noon. It is now 3 PM, and you need it to finish a report.", "question": "How do you respond without inventing a motive?", "choices": [{"text": "“I was expecting the information by noon. What is the updated timing? I need it to finish the report.”", "rating": "Strongest response", "why": "You identify the observable delay, state the impact, and request the information needed to act.", "points": 2, "feedback": "You identify the observable delay, state the impact, and request the information needed to act.", "best": true}, {"text": "“I know things come up, but it would help if you warned me earlier next time.”", "rating": "Reasonable alternative", "why": "This may improve future communication, but it does not directly address when you will receive the information now.", "points": 1, "feedback": "This may improve future communication, but it does not directly address when you will receive the information now. Another approach: “I was expecting the information by noon. What is the updated timing? I need it to finish the report.” You identify the observable delay, state the impact, and request the information needed to act.", "best": false}, {"text": "“I will finish the rest of the report and mention the delay if anyone asks.”", "rating": "Partly effective", "why": "Working on what you can control is sensible, but avoiding a direct follow-up may prolong the blockage.", "points": 1, "feedback": "Working on what you can control is sensible, but avoiding a direct follow-up may prolong the blockage. Another approach: “I was expecting the information by noon. What is the updated timing? I need it to finish the report.” You identify the observable delay, state the impact, and request the information needed to act.", "best": false}]}], "quiz": [{"q": "Your friend has not replied. Which statement is a fact?", "choices": ["“My friend has been online but has not answered my message.”", "“My friend saw the message and decided I was unimportant.”", "“My friend is avoiding a difficult conversation.”"], "correct": 0, "why": "Activity and lack of reply may be observable. Their motive remains unknown. Strongest answer: “My friend has been online but has not answered my message.”"}, {"q": "A glance reminds you of a previous disagreement. What is the strongest interpretation?", "choices": ["“They are likely still angry, so I should protect myself.”", "“My unease is real, but the glance does not establish what they think.”", "“They must have moved on because they did not speak.”"], "correct": 1, "why": "A real feeling does not turn an uncertain interpretation into a fact. Strongest answer: “My unease is real, but the glance does not establish what they think.”"}, {"q": "A coworker misses a deadline. Which response is most effective?", "choices": ["“You seem overwhelmed, so I will wait until you are ready.”", "“I will tell my supervisor you are unreliable.”", "“The noon deadline passed. When can I expect the information I need?”"], "correct": 2, "why": "A factual, direct request addresses the problem without assuming the cause. Strongest answer: “The noon deadline passed. When can I expect the information I need?”"}]};
const app=document.getElementById('app');let stage='scenarios',index=0,selected=null,score=0,quizScore=0;
function add(tag,cls,content,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;(parent||app).append(e);return e}
function panel(){return add('section','panel',undefined,app)}
function button(label,action,cls,parent){const b=add('button',cls||'button',label,parent);b.type='button';b.addEventListener('click',action);return b}
function progress(current,total,parent){const p=add('div','progress',undefined,parent);p.setAttribute('role','progressbar');p.setAttribute('aria-valuenow',current);p.setAttribute('aria-valuemin',0);p.setAttribute('aria-valuemax',total);p.setAttribute('aria-label','Lesson progress');const bar=add('div','',undefined,p);bar.style.width=(100*current/total)+'%'}
function next(){selected=null;index++;if(stage==='scenarios'&&index>=DATA.scenarios.length){stage='quiz';index=0}else if(stage==='quiz'&&index>=DATA.quiz.length){stage='done';index=0}render();window.scrollTo(0,0)}
function reset(){stage='scenarios';index=0;selected=null;score=0;quizScore=0;render();window.scrollTo(0,0)}
function render(){app.replaceChildren();if(stage==='scenarios'){
 const s=DATA.scenarios[index],c=panel();add('div','eyebrow',`Situation ${index+1} of ${DATA.scenarios.length}`,c);progress(index,DATA.scenarios.length,c);add('h1','',s.title,c);add('p','',s.scene,c);add('p','question',s.question,c);
 s.choices.forEach((o,i)=>{const b=button(o.text,()=>{if(selected!==null)return;selected=i;if(o.best)score++;render()},'choice'+(selected===i?' selected':''),c);b.disabled=selected!==null});
 if(selected!==null){const o=s.choices[selected],f=add('div','feedback',undefined,c);add('strong','',o.best?'Why this works':'Consider the tradeoff',f);add('div','',o.feedback,f);button(index===DATA.scenarios.length-1?'Continue to knowledge check':'Next',next,'button',c)}return}
 if(stage==='quiz'){const q=DATA.quiz[index],c=panel();add('div','eyebrow',`Knowledge check ${index+1} of ${DATA.quiz.length}`,c);progress(index,DATA.quiz.length,c);add('h1','','Check your understanding',c);add('p','question',q.q,c);
 q.choices.forEach((o,i)=>{const b=button(o,()=>{if(selected!==null)return;selected=i;if(i===q.correct)quizScore++;render()},'choice'+(selected===i?' selected':''),c);b.disabled=selected!==null});
 if(selected!==null){const f=add('div','feedback',undefined,c);add('strong','',selected===q.correct?'Why this works':'Consider the tradeoff',f);add('div','',q.why,f);button(index===DATA.quiz.length-1?'See my results':'Next',next,'button',c)}return}
 const c=panel();add('div','eyebrow','Lesson complete',c);add('h1','','The Story We Tell Ourselves',c);add('p','',`Practice: ${score} of ${DATA.scenarios.length} strongest choices. Knowledge check: ${quizScore} of ${DATA.quiz.length} correct.`,c);add('p','', 'What matters is recognizing the tradeoffs, not getting every answer right the first time. Practice noticing, understanding, and responding thoughtfully in daily life.',c);button('Practice again',reset,'button',c);const a=add('a','','Back to all lessons',c);a.href='../../';a.style.display='block';a.style.marginTop='18px'
}render();</script></body></html>
